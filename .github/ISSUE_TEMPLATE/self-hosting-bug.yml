name: Self-hosting bug
description: Something is broken on a copy of Skrongle you run yourself.
title: "Self-hosting: "
labels: ["self-hosting"]
body:
  - type: markdown
    attributes:
      value: |
        Self-hosting is free and help is best-effort. Questions ("how do I…?")
        go to [Discussions](https://github.com/alexbeeken/skrongle-mini/discussions);
        first check the [self-hosting FAQ](https://github.com/alexbeeken/skrongle-mini/blob/main/docs/self-hosting-faq.md).
        This form is for bugs: something that should work and doesn't.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`/opt/skrongle/skrongle --version`, or the release you downloaded."
      placeholder: skrongle 0.2.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: What it runs on.
      placeholder: Raspberry Pi Zero 2 W / Pi 4 (4 GB) / a VPS with 1 GB / a mini PC
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: "`cat /etc/os-release` and `uname -m`."
      placeholder: Raspberry Pi OS Lite 64-bit (Bookworm), aarch64
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        The output of `skrongle doctor`. It never prints secrets: keys and passwords show as yes/no.
        With the systemd unit, run it with the service's settings:
        `sudo env $(systemctl show skrongle -p Environment --value) /opt/skrongle/skrongle doctor --env-file /etc/skrongle/env`
      render: text
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "The last lines of the log: `journalctl -u skrongle -n 50 --no-pager`. Check it for anything private before posting."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I read the [self-hosting FAQ](https://github.com/alexbeeken/skrongle-mini/blob/main/docs/self-hosting-faq.md).
          required: true
        - label: The diagnostics and log above contain no passwords or keys.
          required: true
