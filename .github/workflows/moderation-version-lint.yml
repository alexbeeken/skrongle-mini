# A PR that changes the content check's rules (the term list, the Jev
# questions and threshold, stage 2's prompt) raises TERMS_VERSION or
# AI_CHECK_VERSION, or says `moderation-version: unchanged` in its body
# (scripts/moderation-version-lint.sh, #1039). Not a required check (see the
# ruleset note in CLAUDE.md, "Pull requests"). `edited`: fixing the body
# runs it again.
name: moderation-version-lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - data/moderation/**
      - src/**

jobs:
  moderation-version:
    name: moderation rules change has a new version
    runs-on: ${{ vars.CI_RUNNER || 'laptop' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the term list and the AI check's rules change with their version
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/moderation-version-lint.sh "origin/${{ github.base_ref }}" HEAD
