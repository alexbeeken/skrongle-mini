name: pi budget

# Pi budget (#638): the stripped release binary, and the idle server's
# memory and threads, against scripts/pi-budget.txt; the numbers go in the
# job summary. The only release build in CI (fat LTO, the slowest build
# here), so it runs on pushes to main and on pull requests that touch what is
# compiled into the binary, not on every PR. Not a required check.
# Remove the `paths` filter under `pull_request` to run it on every PR.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - .cargo/config.toml
      - static/**
      - i18n/**
      - docs/**
      - templates/**
      - scripts/pi-budget.*
      - .github/workflows/pi-budget.yml

jobs:
  pi-budget:
    name: pi budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: scripts/pi-budget.sh
