# On every PR, as separate checks: the Rust tests, the
# server smoke test (scripts/smoke.sh), the exact browser specs and the
# smoke specs (e2e/specs/smoke/), each suite in Playwright shards. Each job
# starts its own fresh seeded server.
# No key and no network beyond installing tools. See docs/testing.md, "Smoke specs".
#
# Every job runs on GitHub-hosted runners (ubuntu-latest). The Rust and
# npm caches (rust-cache, setup-node) are GitHub's. See docs/testing.md,
# "CI runners".
name: checks

# Not on pushes to main: a PR's run already tested it merged into main,
# and the ruleset makes a PR be up to date with main before it merges.
on:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# CI is for finding failures, not for debugging them: builds carry only
# line tables (panics and backtraces still name file:line), which compiles
# and links much faster than full debug info. Debug locally, where the dev
# profile keeps full debug info. For a failure that only CI shows, set the
# repo variable CI_DEBUGINFO=full for a run, then delete it (docs/testing.md,
# "CI runners"); changing it rebuilds once.
env:
  CARGO_PROFILE_DEV_DEBUG: ${{ vars.CI_DEBUGINFO || 'line-tables-only' }}

jobs:
  # cargo test and smoke.sh build nearly the same code, so they share one
  # job and one build. Their checks stay separate: this job fails only on
  # cargo test, and the smoke gate below reports smoke.sh's outcome.
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      smoke: ${{ steps.smoke.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Release builds abort on panic: no new unwrap/expect/indexing outside tests (#389).
      - run: scripts/panic-check.sh
      # No source file grows past 1,500 non-test lines, or its baseline (#908).
      - run: scripts/file-size-lint.sh
      # A release build has no dev feature (the /dev pages, the simulated
      # provider, the test course): it must still compile.
      - run: cargo check --no-default-features
      - run: cargo test --features dev
      - id: smoke
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Then a first start as a non-root user with the database in a temp
        # dir (the static-user unit in docs/self-hosting.md).
        run: |
          export SERVER_BIN=$(scripts/ci-build.sh)
          scripts/smoke.sh
          scripts/non-root-start.sh

  server-smoke-gate:
    name: server smoke test (scripts/smoke.sh)
    needs: rust
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.rust.outputs.smoke }}" = success ] || { echo "scripts/smoke.sh: ${{ needs.rust.outputs.smoke || needs.rust.result }} (see the cargo test job)"; exit 1; }'

  # The browser suites run in Playwright shards, one job each, so a suite's
  # specs (one worker: they share the dev user) spread over several runners.
  # Sharding is by spec file; a new file lands in a shard on its own. The
  # gate jobs below carry the check names the ruleset requires.
  e2e-exact:
    name: e2e exact specs ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/e2e
        with:
          specs: specs/exact.spec.ts specs/pathways.spec.ts specs/forms.spec.ts specs/editor-autosave.spec.ts specs/modals.spec.ts specs/lesson-tables.spec.ts specs/authenticator.spec.ts specs/dev-ai.spec.ts specs/two-factor.spec.ts specs/i18n.spec.ts specs/profile-nav.spec.ts specs/manage-keys.spec.ts specs/create.spec.ts specs/course-copy.spec.ts specs/docs.spec.ts specs/owner-resets.spec.ts specs/course-translate.spec.ts specs/lesson-editor.spec.ts specs/lesson-editor-rules.spec.ts specs/course-card-stats.spec.ts specs/share-sign-in.spec.ts specs/accessibility.spec.ts specs/lesson-header.spec.ts specs/share-edges.spec.ts specs/lesson-duplicate.spec.ts specs/mistakes.spec.ts specs/word-list.spec.ts specs/lesson-conversations.spec.ts specs/share-removed.spec.ts specs/notation.spec.ts specs/course-lints.spec.ts specs/landing-try.spec.ts specs/fact-check.spec.ts specs/lesson-ai-edit.spec.ts specs/music-sound.spec.ts specs/fill-bar.spec.ts specs/chord-spell.spec.ts specs/staff-note.spec.ts specs/keyboard.spec.ts specs/scale-ladder.spec.ts specs/advice-badge.spec.ts specs/ai-examples.spec.ts specs/words-due.spec.ts specs/algebra-tiles.spec.ts specs/clock.spec.ts specs/measure.spec.ts
          shard: ${{ matrix.shard }}
          report-name: playwright-report-exact-${{ strategy.job-index }}
          # The specs' type check and unit tests, once per run, in the
          # shortest shard.
          ts-checks: ${{ matrix.shard == '3/3' }}

  e2e-smoke:
    name: e2e smoke specs ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/e2e
        with:
          specs: specs/smoke
          shard: ${{ matrix.shard }}
          report-name: playwright-report-smoke-${{ strategy.job-index }}

  # A skipped required check counts as passed, so the gates run unless the
  # run was cancelled, and fail unless every shard succeeded.
  e2e-exact-gate:
    name: e2e exact specs
    needs: e2e-exact
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.e2e-exact.result }}" = success ] || { echo "a shard did not pass: ${{ needs.e2e-exact.result }}"; exit 1; }'

  e2e-smoke-gate:
    name: e2e smoke specs
    needs: e2e-smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.e2e-smoke.result }}" = success ] || { echo "a shard did not pass: ${{ needs.e2e-smoke.result }}"; exit 1; }'

  # Pi budget (#638): the stripped release binary, and the idle server's
  # memory and threads, against scripts/pi-budget.txt; the numbers go in the
  # job summary. The only release build in CI (fat LTO, the slowest build
  # here, ); not a required check.
  # Off for now (#1387): remove `if: false` to turn it back on.
  pi-budget:
    name: pi budget
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: scripts/pi-budget.sh
