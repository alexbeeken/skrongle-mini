# A PR that edits the built-in Terms (docs/terms.md) or the privacy notice
# (docs/privacy.md) adds an entry to docs/terms-changes.json, and a new
# entry comes with a text change (scripts/terms-lint.sh, #966, #978). Not a
# required check (see the ruleset note in CLAUDE.md, "Pull requests").
name: terms-lint

on:
  pull_request:
    paths:
      - docs/terms.md
      - docs/privacy.md
      - docs/terms-changes.json

jobs:
  terms-changelog:
    name: terms change has a changelog entry
    runs-on: ${{ vars.CI_RUNNER || 'laptop' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: docs/terms.md and docs/terms-changes.json change together
        run: scripts/terms-lint.sh "origin/${{ github.base_ref }}" HEAD
