# Configuration for `cross` (https://github.com/cross-rs/cross), the Docker/OrbStack
# based alternative to cargo-zigbuild. Nothing special is needed: rusqlite's
# "bundled" feature compiles SQLite with the image's cross GCC.
[build.env]
passthrough = ["LIBSQLITE3_FLAGS"]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"
