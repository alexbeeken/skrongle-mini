AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Skrongle account audit log (#973): one multi-region CloudTrail trail of
  management events, with log file validation, into a private S3 bucket
  that deletes logs after RetentionDays. A stack of its own, deployed once
  by the account admin (ops/aws-root-cleanup.md, step 4), never by
  scripts/deploy-aws.sh: the deploy identity must not be able to switch
  off the log that records what it does.

Parameters:
  TrailName:
    Type: String
    Default: skrongle-audit
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$"
  RetentionDays:
    Type: Number
    Default: 365
    MinValue: 90
    Description: Days a log file is kept before S3 deletes it.

Resources:
  TrailBucket:
    Type: AWS::S3::Bucket
    # Kept if the stack is deleted, so deleting the stack cannot erase the log.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: !Ref RetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: drop-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-cloudtrail" }

  # The bucket policy CloudTrail needs, limited to this account's trail
  # (aws:SourceArn), plus HTTPS only like the app's buckets.
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}"
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}"
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt TrailBucket.Arn
              - !Sub "${TrailBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Ref TrailName
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      # Management events only (the free first copy). No data events, no
      # Insights, no CloudWatch Logs: each of those costs extra.
      Tags:
        - { Key: Name, Value: !Ref TrailName }

Outputs:
  TrailArn:
    Value: !GetAtt Trail.Arn
  TrailBucket:
    Description: Private S3 bucket with the CloudTrail log files (AWSLogs/<account>/CloudTrail/...)
    Value: !Ref TrailBucket
