AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Learnmap: one small ARM instance (default t4g.nano) with a static IP and Caddy
  for automatic HTTPS. Deployed by scripts/deploy-aws.sh; the app binary and
  content are rsynced in afterwards, so the stack itself never changes on a
  release. Deleting the stack deletes the instance and its disk (the database);
  the backup bucket is kept (docs/aws-setup.md, "Backups").

Parameters:
  InstanceType:
    Type: String
    Default: t4g.nano
    Description: ARM (Graviton) instance type; the binary is the same aarch64 build the Pi gets.
  SshPublicKey:
    Type: String
    Description: Public key placed in ec2-user's authorized_keys (from the AWS_SSH_KEY in deploy.env).
  AdminCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach port 22.
  VolumeSize:
    Type: Number
    Default: 8
    Description: Root disk in GB (the database lives on it).
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Latest Amazon Linux 2023 for arm64, looked up at deploy time.
  SettingsPath:
    Type: String
    Default: /skrongle/learnmap
    AllowedPattern: "^/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$"
    Description: >
      Parameter Store path the instance reads its provider settings from at
      every start (AWS_SSM_PATH in deploy.env; scripts/aws-env.sh manages them).

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Learnmap web + admin ssh
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }

  # The instance may read the settings under SettingsPath and nothing else.
  # The role is the only AWS identity on the box; the deploy never ships keys.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "Lets the ${AWS::StackName} instance read its settings under ${SettingsPath}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        # Upload the nightly database copy (deploy/aws/learnmap-backup.sh).
        # Put only: the instance can neither read nor delete a backup.
        - PolicyName: write-backups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BackupBucket.Arn}/daily/*"
        # Data exports (#871, src/storage.rs): the app uploads a finished
        # export, signs a short download link and deletes it after use.
        - PolicyName: export-files
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "${FilesBucket.Arn}/exports/*"
        - PolicyName: read-settings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SettingsPath}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SettingsPath}/*"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      # The role's credentials come from the metadata service; require the
      # session-token flavour (IMDSv2) so a request forged through the app
      # could not fetch them.
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }
        # SnapshotPolicy snapshots every volume of the instance carrying this tag.
        - { Key: learnmap-snapshots, Value: !Sub "${AWS::StackName}" }
      # First boot only: ssh key, rsync, the service user, and Caddy as a
      # systemd service. Everything app-specific arrives over rsync later.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/learnmap-firstboot.log 2>&1
          mkdir -p /home/ec2-user/.ssh
          echo "${SshPublicKey}" >> /home/ec2-user/.ssh/authorized_keys
          chown -R ec2-user:ec2-user /home/ec2-user/.ssh
          chmod 700 /home/ec2-user/.ssh && chmod 600 /home/ec2-user/.ssh/authorized_keys
          # A 1 GB swap file before anything else (#1362): with 512 MB, loading
          # the dnf repository metadata alone got first boot OOM-killed. Kept
          # for the app's own peaks.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile.new bs=1M count=1024 status=none
            chmod 600 /swapfile.new
            mkswap /swapfile.new
            mv /swapfile.new /swapfile
          fi
          swapon --show=NAME --noheadings | grep -x /swapfile >/dev/null || swapon /swapfile
          grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap defaults 0 0' >> /etc/fstab
          # rsync and the AWS CLI ship with the AMI; dnf only runs if one is missing.
          command -v rsync >/dev/null 2>&1 || dnf install -y rsync
          command -v aws >/dev/null 2>&1 || dnf install -y awscli-2   # reads Parameter Store at each start
          id learnmap >/dev/null 2>&1 || useradd --system --home-dir /var/lib/learnmap --shell /usr/sbin/nologin learnmap
          mkdir -p /opt/learnmap /var/lib/learnmap /etc/learnmap /etc/caddy /var/lib/caddy
          chown learnmap:learnmap /var/lib/learnmap && chmod 750 /var/lib/learnmap
          # Caddy: a pinned release from GitHub (arm64), checked against the
          # SHA-512 in that release's caddy_<version>_checksums.txt (#392).
          # To upgrade, change both lines to the new release's values.
          CADDY_VERSION=2.11.7
          CADDY_SHA512=3db36ba90c7a6e8dda40ee3dd71fa08844c76b5fb08f61b31e5e78d2ed38e71c51dc7baed875e50d1ca1279196e84302967237386ae87c91ae9f2aaceada682e
          id caddy >/dev/null 2>&1 || useradd --system --home-dir /var/lib/caddy --shell /usr/sbin/nologin caddy
          CADDY_TGZ=/tmp/caddy.tar.gz
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v$CADDY_VERSION/caddy_$CADDY_VERSION""_linux_arm64.tar.gz" -o $CADDY_TGZ
          echo "$CADDY_SHA512  $CADDY_TGZ" | sha512sum -c -
          tar -xzf $CADDY_TGZ -C /usr/local/bin caddy
          rm -f $CADDY_TGZ
          chown root:root /usr/local/bin/caddy && chmod 755 /usr/local/bin/caddy
          chown -R caddy:caddy /var/lib/caddy /etc/caddy
          cat > /etc/systemd/system/caddy.service <<'EOF'
          [Unit]
          Description=Caddy (HTTPS reverse proxy for Learnmap)
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=caddy
          Group=caddy
          ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
          ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile --force
          TimeoutStopSec=5s
          LimitNOFILE=1048576
          PrivateTmp=true
          ProtectSystem=full
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
          EOF
          # A placeholder Caddyfile until the deploy script writes the real one.
          [ -f /etc/caddy/Caddyfile ] || printf ':80 {\n  respond "Learnmap: waiting for the first deploy" 503\n}\n' > /etc/caddy/Caddyfile
          systemctl daemon-reload
          systemctl enable --now caddy
          touch /var/lib/learnmap/.firstboot-done

  StaticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }

  # Backups (#964). One gzipped `sqlite3 .backup` a night, uploaded by the
  # instance to daily/YYYY-MM-DD.db.gz. Nothing is kept longer than 31 days,
  # the privacy notice's limit (#972): a copy expires 30 days after upload,
  # and a version replaced or expired is deleted a day later. Kept when the
  # stack is deleted, so `--destroy` cannot take the backups with it; the
  # lifecycle rules keep emptying it on their own.
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-31-days
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: drop-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-backups" }

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Learners' data exports (#871): uploaded by the app under exports/,
  # downloaded through a pre-signed link that works for 60 seconds, and
  # deleted by the app after the download. Whatever it misses goes after two
  # days. Private, encrypted, HTTPS only, no versions kept. The app learns
  # its name from SKRONGLE_S3_BUCKET (scripts/deploy-aws.sh writes it).
  # Kept when the stack is deleted, like the backups; the rule empties it.
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-exports-after-2-days
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 2
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-files" }

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FilesBucket.Arn
              - !Sub "${FilesBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # A nightly snapshot of the whole disk, kept 14 days: the second copy,
  # restored as a volume (docs/aws-setup.md, "Restore from a snapshot").
  # Snapshots outlive the stack; after `--destroy` nothing prunes them.
  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "Lets Data Lifecycle Manager snapshot the ${AWS::StackName} instance"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole"
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: !Sub "Nightly snapshot of ${AWS::StackName} kept 14 days"   # DLM allows letters, digits, spaces, _ and - only
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [INSTANCE]
        TargetTags:
          - { Key: learnmap-snapshots, Value: !Sub "${AWS::StackName}" }
        Schedules:
          - Name: nightly
            CopyTags: true
            TagsToAdd:
              - { Key: learnmap-snapshot-of, Value: !Sub "${AWS::StackName}" }
            CreateRule:
              Interval: 24
              IntervalUnit: HOURS
              Times: ["04:30"]
            RetainRule:
              Interval: 14
              IntervalUnit: DAYS
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }

Outputs:
  PublicIp:
    Description: Static public IPv4 address of the instance
    Value: !Ref StaticIp
  InstanceId:
    Value: !Ref Instance
  BackupBucket:
    Description: Private S3 bucket with the nightly database copies (daily/YYYY-MM-DD.db.gz)
    Value: !Ref BackupBucket
  FilesBucket:
    Description: Private S3 bucket with learners' data exports (exports/, deleted after 2 days); SKRONGLE_S3_BUCKET
    Value: !Ref FilesBucket
