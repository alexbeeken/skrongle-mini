# Included from the HTTPS server block for your public host name (PI_PUBLIC_URL)
# (installed to /etc/nginx/snippets/spanish-learning.conf by scripts/deploy.sh).
# The app knows its own prefix (SKRONGLE_BASE_PATH=/spanish), so nothing is rewritten.
location /spanish {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Compress what the app does not: HTML and JSON (nginx's default gzip_types
    # is HTML only). Static files are pre-gzipped in the binary and carry
    # Content-Encoding already, so nginx passes them through untouched.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Long timeouts so slow AI requests are not cut off.
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
