mail:
  waitlist_confirm:
    subject: "Bestätige deinen Platz auf der Warteliste von {app}"
    text: |
      Hallo,

      bitte bestätige, dass du auf die Warteliste von {app} möchtest, indem du diesen Link öffnest:

      {link}

      Wir schicken dir eine Einladung per E-Mail, wenn du an der Reihe bist. Wenn du das nicht angefragt hast, ignoriere diese Nachricht: Die Adresse wird nur eingetragen, wenn der Link geöffnet wird.
    html: |
      <p>Hallo,</p>
      <p>bitte bestätige, dass du auf die Warteliste von {app} möchtest:</p>
      <p><a href="{link}">Meinen Platz bestätigen</a></p>
      <p>Oder füge diesen Link in deinen Browser ein: {link}</p>
      <p>Wir schicken dir eine Einladung per E-Mail, wenn du an der Reihe bist. Wenn du das nicht angefragt hast, ignoriere diese Nachricht: Die Adresse wird nur eingetragen, wenn der Link geöffnet wird.</p>
  waitlist_invite:
    subject: "Deine Einladung zu {app}"
    text: |
      Hallo,

      du bist an der Reihe: Du bist eingeladen, dein {app}-Konto anzulegen. Öffne diesen Link und registriere dich mit dieser E-Mail-Adresse ({email}):

      {link}

      Die Einladung gilt {days} Tage.
    html: |
      <p>Hallo,</p>
      <p>du bist an der Reihe: Du bist eingeladen, dein {app}-Konto anzulegen. Registriere dich mit dieser E-Mail-Adresse ({email}).</p>
      <p><a href="{link}">Mein Konto anlegen</a></p>
      <p>Oder füge diesen Link in deinen Browser ein: {link}</p>
      <p>Die Einladung gilt {days} Tage.</p>
  terms_change:
    subject: "Die Nutzungsbedingungen von {app} ändern sich am {date}"
    text: |
      Hallo,

      Wir ändern die Nutzungsbedingungen von {app}. Die neuen Bedingungen gelten ab {date}.

      Was sich ändert:
      {summary}

      Die neuen Bedingungen lesen: {link}

      Ab {date} wirst du bei der Anmeldung gebeten, sie zu akzeptieren. Wenn du nicht einverstanden bist, kannst du dein Konto in deinem Profil schließen.
    html: |
      <p>Hallo,</p>
      <p>Wir ändern die Nutzungsbedingungen von {app}. Die neuen Bedingungen gelten ab {date}.</p>
      <p>Was sich ändert:</p>
      {summary}
      <p><a href="{link}">Die neuen Bedingungen lesen</a></p>
      <p>Ab {date} wirst du bei der Anmeldung gebeten, sie zu akzeptieren. Wenn du nicht einverstanden bist, kannst du dein Konto in deinem Profil schließen.</p>
  verify_email:
    subject: "Bestätige deine E-Mail-Adresse für {app}"
    text: |
      Hallo,

      bitte bestätige, dass dies deine E-Mail-Adresse für {app} ist, indem du diesen Link öffnest:

      {link}

      Der Link funktioniert einmal, 24 Stunden lang. Wenn du dich nicht bei {app} angemeldet hast, ignoriere diese Nachricht: Die Adresse gilt erst als bestätigt, wenn der Link geöffnet wird. {app} schickt einer Adresse höchstens {max} dieser Nachrichten am Tag.
    html: |
      <p>Hallo,</p>
      <p>bitte bestätige, dass dies deine E-Mail-Adresse für {app} ist:</p>
      <p><a href="{link}">Meine E-Mail-Adresse bestätigen</a></p>
      <p>Oder füge diesen Link in deinen Browser ein: {link}</p>
      <p>Der Link funktioniert einmal, 24 Stunden lang. Wenn du dich nicht bei {app} angemeldet hast, ignoriere diese Nachricht: Die Adresse gilt erst als bestätigt, wenn der Link geöffnet wird. {app} schickt einer Adresse höchstens {max} dieser Nachrichten am Tag.</p>
  password_reset:
    subject: "Setze dein {app}-Passwort zurück"
    text: |
      Hallo,

      jemand (hoffentlich du) hat darum gebeten, das Passwort deines {app}-Kontos zurückzusetzen. Wähle ein neues, indem du diesen Link öffnest:

      {link}

      Der Link funktioniert einmal, eine Stunde lang, und meldet dich überall ab. Wenn du nicht darum gebeten hast, ignoriere diese Nachricht; dein Passwort bleibt, wie es ist.
    html: |
      <p>Hallo,</p>
      <p>jemand (hoffentlich du) hat darum gebeten, das Passwort deines {app}-Kontos zurückzusetzen.</p>
      <p><a href="{link}">Neues Passwort wählen</a></p>
      <p>Oder füge diesen Link in deinen Browser ein: {link}</p>
      <p>Der Link funktioniert einmal, eine Stunde lang, und meldet dich überall ab. Wenn du nicht darum gebeten hast, ignoriere diese Nachricht; dein Passwort bleibt, wie es ist.</p>
  register_taken:
    subject: "Du hast bereits ein {app}-Konto"
    text: |
      Hallo,

      jemand hat versucht, mit dieser E-Mail-Adresse ein neues {app}-Konto anzulegen. Sie hat bereits ein Konto, also wurde nichts angelegt.

      Wenn du das warst, melde dich hier an:

      {login}

      Passwort vergessen? Wähle hier ein neues:

      {reset}

      Wenn du das nicht warst, ignoriere diese Nachricht; dein Konto ist unverändert.
    html: |
      <p>Hallo,</p>
      <p>jemand hat versucht, mit dieser E-Mail-Adresse ein neues {app}-Konto anzulegen. Sie hat bereits ein Konto, also wurde nichts angelegt.</p>
      <p>Wenn du das warst: <a href="{login}">Anmelden</a></p>
      <p>Passwort vergessen? <a href="{reset}">Neues Passwort wählen</a></p>
      <p>Wenn du das nicht warst, ignoriere diese Nachricht; dein Konto ist unverändert.</p>
  account_deletion:
    subject: "Dein {app}-Konto wird am {date} gelöscht"
    text: |
      Hallo,

      du hast die Löschung deines {app}-Kontos angefordert. Es wird am {date} endgültig gelöscht, mit deinem Fortschritt, deinen Kursen und gespeicherten Schlüsseln.

      Wenn du es behalten willst, melde dich vorher bei {app} an und wähle Löschung abbrechen.

      Wenn du das nicht angefordert hast, melde dich an, brich die Löschung ab und ändere dein Passwort.
  data_export:
    subject: "Deine {app}-Daten sind zum Herunterladen bereit"
    text: |
      Hallo,

      die Kopie deiner {app}-Daten, die du angefordert hast, ist fertig. Melde dich bei {app} an und öffne dann diesen Link, um sie herunterzuladen:

      {link}

      Der Link funktioniert einmal, 24 Stunden lang, und nur, solange du in diesem Konto angemeldet bist. Wenn du das nicht angefordert hast, ändere dein Passwort: Dann ist jemand anderes in deinem Konto angemeldet.
    html: |
      <p>Hallo,</p>
      <p>die Kopie deiner {app}-Daten, die du angefordert hast, ist fertig. Melde dich bei {app} an und öffne dann diesen Link, um sie herunterzuladen:</p>
      <p><a href="{link}">Meine Daten herunterladen</a></p>
      <p>Der Link funktioniert einmal, 24 Stunden lang, und nur, solange du in diesem Konto angemeldet bist. Wenn du das nicht angefordert hast, ändere dein Passwort: Dann ist jemand anderes in deinem Konto angemeldet.</p>
  two_factor_changed:
    subject: "Zwei-Faktor-Anmeldung bei {app} geändert"
    now_off: "ist jetzt aus"
    now_email: "schickt dir jetzt einen Code per E-Mail"
    now_sms: "schickt dir jetzt einen Code per SMS aufs Handy"
    now_totp: "fragt dich jetzt nach einem Code aus einer Authenticator-App"
    text: |
      Hallo,

      die Zwei-Faktor-Anmeldung bei {app} {now}.

      Alle anderen Geräte wurden abgemeldet. Wenn du diese Änderung nicht vorgenommen hast, war jemand anderes in deinem Konto angemeldet: Melde dich an, nutze auf deinem Profil „Überall sonst abmelden“ und stelle die Zwei-Faktor-Anmeldung wieder zurück.
    html: |
      <p>Hallo,</p>
      <p>die Zwei-Faktor-Anmeldung bei {app} <strong>{now}</strong>.</p>
      <p>Alle anderen Geräte wurden abgemeldet. Wenn du diese Änderung nicht vorgenommen hast, war jemand anderes in deinem Konto angemeldet: Melde dich an, nutze auf deinem Profil „Überall sonst abmelden“ und stelle die Zwei-Faktor-Anmeldung wieder zurück.</p>
  login_code:
    subject: "Dein {app}-Code zum Anmelden"
    text: |
      Hallo,

      dein Code, um die Anmeldung bei {app} abzuschließen:

      {code}

      Er funktioniert 10 Minuten lang. Wenn du nicht versucht hast, dich anzumelden, ändere dein Passwort: Jemand anderes kennt es.
    html: |
      <p>Hallo,</p>
      <p>dein Code, um die Anmeldung bei {app} abzuschließen:</p>
      <p style="font-size:1.6em;letter-spacing:.15em"><strong>{code}</strong></p>
      <p>Er funktioniert 10 Minuten lang. Wenn du nicht versucht hast, dich anzumelden, ändere dein Passwort: Jemand anderes kennt es.</p>
  two_factor_confirm:
    subject: "Dein {app}-Code zum Ändern der Zwei-Faktor-Anmeldung"
    text: |
      Hallo,

      dein Code, um die Zwei-Faktor-Anmeldung bei {app} auszuschalten oder zu ändern:

      {code}

      Er funktioniert 10 Minuten lang. Wenn du ihn nicht angefordert hast, ist jemand anderes in deinem Konto angemeldet: Nutze auf deinem Profil „Überall sonst abmelden“.
    html: |
      <p>Hallo,</p>
      <p>dein Code, um die Zwei-Faktor-Anmeldung bei {app} auszuschalten oder zu ändern:</p>
      <p style="font-size:1.6em;letter-spacing:.15em"><strong>{code}</strong></p>
      <p>Er funktioniert 10 Minuten lang. Wenn du ihn nicht angefordert hast, ist jemand anderes in deinem Konto angemeldet: Nutze auf deinem Profil „Überall sonst abmelden“.</p>
  course_share:
    subject: "{owner} hat dir auf {app} einen Kurs geteilt: {title}"
    text: |
      Hallo,
      {owner} hat dir den Kurs „{title}“ auf {app} geteilt. Öffne diesen Link, um ihn zu deinen Kursen hinzuzufügen:
      {link}
      Du kannst aus dem Kurs mit deinem eigenen Fortschritt lernen; nur {owner} kann ihn ändern. Falls du noch kein {app}-Konto hast, kannst du über den Link eines erstellen. Wenn du damit nicht gerechnet hast, ignoriere diese Nachricht einfach.
