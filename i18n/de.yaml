    warn_html: |-
      <strong>⚠️ Vorsicht: das kann deinen Kurs kaputt machen und Geld kosten.</strong>
              Dies sind die Anweisungen, die mit jeder Anfrage gesendet werden. Die App prüft trotzdem jede Datei, und eine Lektion, die die Prüfung nicht besteht, wird bis zu zweimal an das Modell zurückgeschickt, danach bricht der Auftrag ab. Anweisungen, die dem Kursformat widersprechen, verschwenden API-Guthaben bei Wiederholungen und ergeben Kurse, die sich nicht laden lassen. Füge keine Anweisungen ein, die du nicht verstehst: Text von anderen kann das Modell dazu bringen, Dinge zu schreiben, die du nicht bestellt hast. Die Regeln für die Art des Kurses, die Referenz zum Kursformat und die Gliederung werden immer nach diesen Anweisungen angehängt.
