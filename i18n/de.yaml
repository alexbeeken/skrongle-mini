landing:
  title: "Lerne alles aus einem Ordner mit JSON-Dateien"
  hero_h1: "Lerne alles aus einem Ordner mit JSON-Dateien."
  hero_lead: "{app} ist eine Lern-App nach dem Vorbild beliebter Lernplattformen. Schreib einen Kurs als einfaches JSON, füg ihn hinzu, und jede Lektion wird zu Lernseiten, adaptiven Quizzes, Karteikarten, fünfminütigen Sitzungen auf dem Handy, Hörübungen und Spielen. Kein Code, keine Content-Pipeline, kein zweites Format."
  create_account: "Konto erstellen"
  read_format: "Das Kursformat lesen"
  have_account_html: "Du hast schon ein Konto? <a href=\"{url}\" data-testid=\"landing-login\">Anmelden</a>."
  two_files_h2: "Ein Kurs besteht aus zwei Dateien. Alles andere ist optional."
  two_files_lead_html: "Eine <code>course.json</code> benennt die Einheiten und die beiden Seiten jeder Karteikarte. Jede Lektion ist eine Datei. Füg ein Feld hinzu, und eine Funktion wird aktiv; lass es weg, und diese Funktion erscheint für diese Lektion einfach nicht. Nichts bricht, nichts nervt."
  field_content_html: "Markdown. Jeder <code>##</code>-Abschnitt wird zu einer Lektionskarte, einem Leitfaden-Schritt und einem Happen im Sprint-Modus."
  field_vocabulary: "Karteikarten, Antippen zum Anhören, Wortpaare und die Zuordnungsübungen auf dem Handy."
  field_quiz: "Adaptives Üben mit einer Beherrschungswertung pro Lektion, die wächst, abnimmt und steuert, was als Nächstes kommt."
  field_listening: "Hör einen Satz, tipp ihn ab und sieh Wort für Wort, ob er stimmt. Der Browser spricht, also gibt es keine Audiodateien zu hosten."
  field_conjugations: "Paradigmen-Tabellen in jeder Form: Verbformen, Deklinationen, Skalen. Eine Paradigmen-Übung und eine Leiter-Übung kommen dazu."
  field_conversations: "Ein vorgeschriebener Dialog mit seiner Übersetzung auf der Lektionsseite und eine Satzbau-Übung im Sprint-Modus."
  field_sprint_guide: "Handgeschriebene Übungen und Schrittfolgen, wenn die abgeleiteten nicht reichen."
  reference_html: "Die vollständige Referenz mit jedem Feld und jeder Regel, die der Validator prüft, steht unter <a href=\"{url}\">/docs/course-format</a>. Es gibt auch ein JSON-Schema."
  three_ways_h2: "Drei Wege zu einem Kurs"
  write_h3: "Selbst schreiben"
  write_p_html: "Klick auf <em>Kurs erstellen</em>, schließ den KI-Dialog und bearbeite die Dateien im Browser. Jedes Speichern prüft den gesamten Kurs und nennt die genaue Datei und das Feld, das falsch ist, damit ein Tippfehler nie ausgeliefert wird."
  llm_h3: "Ein LLM schreiben lassen"
  llm_p: "Die Formatseite ist so geschrieben, dass man sie einem Modell geben kann. Füg sie in einen beliebigen Chat ein und bitte um Lektionen, dann füg die Antworten auf der Kursseite ein. Oder beschreib den Kurs in der App, bring deinen eigenen API-Schlüssel mit (Anthropic, OpenAI oder einen lokalen Ollama-Server) und sieh zu, wie er eine Lektion nach der anderen schreibt und prüft. Der Schlüssel wird nur für diese Aufgabe verwendet und nie gespeichert."
  ready_h3: "Mit einem fertigen Kurs anfangen"
  ready_p: "Kurse, die mit der App ausgeliefert werden, im selben Format geschrieben, damit du sie als Musterbeispiele lesen und übernehmen kannst, was dir gefällt."
  course_units:
    one: "{n} Einheit"
    other: "{n} Einheiten"
  course_lessons:
    one: "{n} Lektion"
    other: "{n} Lektionen"
  every_way_h2: "Ein Kurs, jede Art zu lernen"
  every_way_lead: "Jede Funktion liest dieselben Dateien. Du schreibst nichts zweimal."
  feat_sprint_h: "Sprint"
  feat_sprint_p: "Fünfminütige Sitzungen, für das Handy gemacht: Wortkacheln, Sortieren, Finden, Bauen, Leiter, Zuordnen, Hörübungen, ein Tagesziel und eine Serie."
  feat_study_h: "Lernen"
  feat_study_p: "Lies die Lektionen richtig durch und mach dann Quizze, die sich auf das konzentrieren, was du falsch machst. Eine Karte jeder Einheit zeigt deine Beherrschung."
  feat_play_h: "Spielen"
  feat_play_p: "Wortpaare mit einer gemeinsamen Bestenliste, eine Paradigmen-Übung, Zahlen nach Gehör, das Datums-Rennen, Karteikarten und der Leitfaden."
  feat_ai_h: "KI-Nachhilfe"
  feat_ai_p: "Ein Tutor im Chat, der dir einzeln hilft: Er erklärt die Lektion, prüft, ob du folgst, und stellt das Quiz, wenn du bereit bist. Läuft mit deinem eigenen Schlüssel."
  feat_hear_h: "Antippen zum Anhören"
  feat_hear_p: "In einem Sprachkurs kann jedes wichtige Wort angetippt und vom Browser mit seinen eigenen Stimmen vorgelesen werden."
  feat_mastery_h: "Beherrschung, die nachlässt"
  feat_mastery_p: "Richtige Antworten bauen eine Wertung mit abnehmendem Zuwachs auf, falsche nehmen einen Happen davon, und eine Pause von einem Monat lässt sie wieder in Richtung Übung sinken."
  small_h2: "Klein genug für einen Raspberry Pi"
  spec_binary_h: "Eine Binärdatei"
  spec_binary_p: "Vorlagen, CSS, Skripte und Dokumentation sind eingebaut; die mitgelieferten Kurse sind einfache Dateien daneben. SQLite ist die ganze Datenbank."
  spec_footprint_h: "Winziger Fußabdruck"
  spec_footprint_p: "Für einen Pi Zero 2 W bemessen: ein paar Megabyte auf der Platte, Dutzende Megabyte im Speicher, zwei asynchrone Worker."
  spec_data_h: "Deine Daten bleiben deine"
  spec_data_p: "Läuft auf deinem eigenen Rechner oder im LAN. Optionaler TLS-Proxy, keine Skripte von Drittanbietern, kein Tracking."
  spec_docs_h: "Dokumentation inklusive"
  spec_docs_p: "Das Format, die Funktionen und die Architektur werden von der App selbst ausgeliefert, als Seiten oder als reines Markdown für ein LLM."
  final_h2: "Registrier dich, dann beantworte eine Frage: Was möchtest du lernen?"
  browse_docs: "Dokumentation durchstöbern"
  feat_guide_h: "Guide"
  feat_guide_p: "Jede Lektion als Etappe aus kleinen Schritten: Karten, kurze Checks, Karteikarten und Tipps, mit Sternen am Ende."
  try_lead: "Zwanzig Sekunden von jedem Modus. Wähle einen und probier ihn aus."
  try_noscript: "Schalte JavaScript ein, um jeden Modus hier auszuprobieren."
  uses_h2: "Was kann ich damit machen?"
  use_niche_h: "Ein Nischenthema lernen"
  use_niche_p: "Niemand verkauft einen Kurs dazu? Schreib einen, oder lass eine KI ihn aus deinen Notizen schreiben."
  use_work_h: "Berufliche Schulungen ergänzen"
  use_work_p: "Mach aus dem Handbuch oder dem Prüfungsstoff Lektionen und Quizze."
  use_goals_h: "Auf langfristige Ziele hinarbeiten"
  use_goals_p: "Fünf Minuten am Tag auf dem Handy, mit Tagesziel und Serie, damit du dranbleibst."
  use_fresh_h: "Wichtiges frisch halten"
  use_fresh_p: "Wissen verblasst, wenn du wegbleibst, und das Üben holt zuerst zurück, was verblasst."
  use_mood_h: "Lernen, wie es dir passt"
  use_mood_p: "Sprint im Bus, Lesen am Schreibtisch, ein Spiel, wenn du müde bist. Der Fortschritt ist derselbe."
  use_exam_h: "Für eine Prüfung lernen"
  use_exam_p: "Die Quizze setzen auf das, was du falsch machst, damit die Lernzeit dorthin geht, wo sie nötig ist."
