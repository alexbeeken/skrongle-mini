landing:
  title: Learn anything from a folder of JSON files
  hero_h1: Learn anything from a folder of JSON files.
  hero_lead: "{app} is a learning app in the spirit of the popular learning platforms. Write a course as plain JSON, add it, and every lesson becomes lesson pages, adaptive quizzes, flashcards, five-minute phone sessions, listening practice and games. No code, no content pipeline, no second format."
  create_account: Create an account
  read_format: Read the course format
  have_account_html: "Already have an account? <a href=\"{url}\" data-testid=\"landing-login\">Log in</a>."
  two_files_h2: A course is two files. Everything else is optional.
  two_files_lead_html: A <code>course.json</code> names the units and the two sides of every flashcard. Each lesson is one file. Add a field and a feature switches on; leave it out and that feature simply does not show for that lesson. Nothing breaks, nothing nags.
  field_content_html: Markdown. Each <code>##</code> section becomes a lesson card, a Guide step and a Sprint mode bite.
  field_vocabulary: Flashcards, tap-to-hear, Word Match and the matching exercises on a phone.
  field_quiz: Adaptive practice with a per-lesson mastery score that grows, decays and steers what comes next.
  field_listening: Hear a sentence, type it, see it checked word by word. Spoken by the browser, so no audio to host.
  field_conjugations: "Paradigm tables of any shape: verb forms, declensions, scales. A drill and a ladder exercise come with them."
  field_conversations: A scripted dialogue with its translation on the lesson page, and a sentence-building exercise in Sprint mode.
  field_sprint_guide: Hand-written exercises and step orders when the derived ones are not enough.
  reference_html: "The full reference, with every field and every rule the validator checks, is at <a href=\"{url}\">/docs/course-format</a>. There is a JSON Schema too."
  three_ways_h2: Three ways to get a course
  write_h3: Write it yourself
  write_p_html: Click <em>Create a course</em>, close the AI dialog and edit the files in the browser. Every save validates the entire course and names the exact file and field that is wrong, so a typo never ships.
  llm_h3: Let an LLM write it
  llm_p: The format page is written to be handed to a model. Paste it into any chat and ask for lessons, then paste the replies into the course page. Or describe the course in the app, bring your own API key (Anthropic, OpenAI or a local Ollama server) and watch it write and validate one lesson at a time. The key is used for that job only and never stored.
  ready_h3: Start from a ready-made one
  ready_p: Courses that ship with the app, written in the same format, so you can read them as worked examples and copy what you like.
  course_units:
    one: "{n} unit"
    other: "{n} units"
  course_lessons:
    one: "{n} lesson"
    other: "{n} lessons"
  every_way_h2: One course, every way to study it
  every_way_lead: Each feature reads the same files. You do not write anything twice.
  feat_sprint_h: Sprint
  feat_sprint_p: "Phone-first five-minute sessions: word tiles, sort, spot, build, ladder, match, listening exercises, a daily goal and a streak."
  feat_study_h: Study
  feat_study_p: Read the lessons properly, then take quizzes weighted towards what you get wrong. A map of every unit shows your mastery.
  feat_play_h: Play
  feat_play_p: Word Match with a shared leaderboard, a paradigm drill, Numbers by ear, Date Dash, flashcards and the Guide.
  feat_ai_h: AI tutoring
  feat_ai_p: A one-to-one tutor over chat that teaches the lesson, checks you follow and sets the quiz when you are ready. Runs on your own key.
  feat_hear_h: Tap to hear
  feat_hear_p: In a language course every word that matters can be tapped and read aloud by the browser's own voices.
  feat_mastery_h: Mastery that decays
  feat_mastery_p: Right answers build a score with diminishing returns, wrong ones take a bite out of it, and a month away drifts it back towards practice.
  # small_h2 and spec_*: the parked "Small enough for a Raspberry Pi" section of the landing page; templates/landing.html says when it returns.
  small_h2: Small enough for a Raspberry Pi
  spec_binary_h: One binary
  spec_binary_p: Templates, CSS, scripts and docs are compiled in; the built-in courses are plain files next to it. SQLite is the whole database.
  spec_footprint_h: Tiny footprint
  spec_footprint_p: "Sized for a Pi Zero 2 W: a few megabytes on disk, tens of megabytes in memory, two async workers."
  spec_data_h: Your data stays yours
  spec_data_p: Runs on your own machine or LAN. Optional TLS proxy, no third-party scripts, no tracking.
  spec_docs_h: Documentation inside
  spec_docs_p: The format, the features and the architecture are served from the app itself, as pages or as raw Markdown for an LLM.
  final_h2: "Register, then answer one question: what would you like to learn?"
  browse_docs: Browse the documentation
  feat_guide_h: "Guide"
  feat_guide_p: "Each lesson as a stage of small steps: cards, quick checks, flashcards and tips, with stars at the end."
  try_lead: "Twenty seconds of each mode. Pick one and try it."
  try_noscript: "Turn on JavaScript to try each mode here."
  uses_h2: "What can I do with it?"
  use_niche_h: "Learn a niche topic"
  use_niche_p: "Nobody sells a course on it? Write one, or have an AI write it from your notes."
  use_work_h: "Supplement training for work"
  use_work_p: "Turn the handbook or the certification syllabus into lessons and quizzes."
  use_goals_h: "Work toward long-term goals"
  use_goals_p: "Five minutes a day on your phone, with a daily goal and a streak to keep it going."
  use_fresh_h: "Keep important concepts fresh"
  use_fresh_p: "Mastery fades while you are away, and practice brings back what is fading first."
  use_mood_h: "Study to suit your mood"
  use_mood_p: "Sprint on the bus, read at your desk, play a game when you are tired. Progress is shared."
  use_exam_h: "Prepare for an exam"
  use_exam_p: "Quizzes lean towards what you get wrong, so revision time goes where it is needed."
