landing:
  title: Aprende lo que sea desde una carpeta de archivos JSON
  hero_h1: Aprende lo que sea desde una carpeta de archivos JSON.
  hero_lead: "{app} es una aplicación de aprendizaje al estilo de las plataformas de aprendizaje populares. Escribe un curso como JSON sencillo, añádelo y cada lección se convierte en páginas de lección, prácticas adaptativas, tarjetas, sesiones de cinco minutos en el teléfono, práctica de escucha y juegos. Sin código, sin pipeline de contenido, sin un segundo formato."
  create_account: Crear una cuenta
  read_format: Leer el formato de curso
  have_account_html: "¿Ya tienes cuenta? <a href=\"{url}\" data-testid=\"landing-login\">Inicia sesión</a>."
  two_files_h2: Un curso son dos archivos. Todo lo demás es opcional.
  two_files_lead_html: Un <code>course.json</code> nombra las unidades y las dos caras de cada tarjeta. Cada lección es un archivo. Agrega un campo y se activa una función; omítelo y esa función simplemente no aparece para esa lección. Nada se rompe, nada molesta.
  field_content_html: Markdown. Cada sección <code>##</code> se convierte en una tarjeta de lección, un paso de la Guía y un bocado del modo Sprint.
  field_vocabulary: Tarjetas, toca para escuchar, Parejas de palabras y los ejercicios de emparejar en el teléfono.
  field_quiz: Práctica adaptativa con una puntuación de dominio por lección que crece, decae y dirige lo que viene después.
  field_listening: Escucha una frase, escríbela y vela corregida palabra por palabra. La lee el navegador, así que no hay audio que alojar.
  field_conjugations: "Tablas de paradigmas de cualquier forma: formas verbales, declinaciones, escalas. Vienen con un ejercicio de repetición y uno de escalera."
  field_conversations: Un diálogo con guion y su traducción en la página de la lección, y un ejercicio de construir frases en el modo Sprint.
  field_sprint_guide: Ejercicios y órdenes de pasos escritos a mano cuando los derivados no bastan.
  reference_html: "La referencia completa, con cada campo y cada regla que comprueba el validador, está en <a href=\"{url}\">/docs/course-format</a>. También hay un JSON Schema."
  three_ways_h2: Tres formas de conseguir un curso
  write_h3: Escríbelo tú mismo
  write_p_html: Haz clic en <em>Crear un curso</em>, cierra el diálogo de IA y edita los archivos en el navegador. Cada guardado valida el curso completo y nombra el archivo y el campo exactos que están mal, así que una errata nunca llega a publicarse.
  llm_h3: Deja que un LLM lo escriba
  llm_p: La página del formato está escrita para entregársela a un modelo. Pégala en cualquier chat y pide lecciones, luego pega las respuestas en la página del curso. O describe el curso en la aplicación, trae tu propia clave de API (Anthropic, OpenAI o un servidor Ollama local) y míralo escribir y validar una lección a la vez. La clave se usa solo para ese trabajo y nunca se guarda.
  ready_h3: Empieza desde uno ya hecho
  ready_p: Cursos que vienen con la aplicación, escritos en el mismo formato, para que los leas como ejemplos resueltos y copies lo que te guste.
  course_units:
    one: "{n} unidad"
    other: "{n} unidades"
  course_lessons:
    one: "{n} lección"
    other: "{n} lecciones"
  every_way_h2: Un curso, todas las formas de estudiarlo
  every_way_lead: Cada función lee los mismos archivos. No escribes nada dos veces.
  feat_sprint_h: Sprint
  feat_sprint_p: "Sesiones de cinco minutos pensadas para el teléfono: fichas de palabras, ordenar, detectar, construir, escalera, emparejar, ejercicios de escucha, una meta diaria y una racha."
  feat_study_h: Estudio
  feat_study_p: Lee las lecciones como es debido y luego haz prácticas con más peso en lo que fallas. Un mapa de cada unidad muestra tu dominio.
  feat_play_h: Juego
  feat_play_p: Parejas de palabras con una tabla de posiciones compartida, un ejercicio de paradigmas, Números de oído, Carrera de fechas, tarjetas y la Guía.
  feat_ai_h: Tutoría con IA
  feat_ai_p: Un tutor individual por chat que enseña la lección, comprueba que la sigues y te pone la práctica cuando estás listo. Funciona con tu propia clave.
  feat_hear_h: Toca para escuchar
  feat_hear_p: En un curso de idiomas, cada palabra que importa se puede tocar para que las voces del propio navegador la lean en voz alta.
  feat_mastery_h: Dominio que decae
  feat_mastery_p: Las respuestas correctas construyen una puntuación con rendimientos decrecientes, las incorrectas le dan un mordisco y un mes sin practicar la devuelve poco a poco hacia la práctica.
  small_h2: Tan pequeño que cabe en una Raspberry Pi
  spec_binary_h: Un solo binario
  spec_binary_p: Las plantillas, el CSS, los scripts y la documentación van compilados dentro; los cursos incluidos son archivos sencillos a su lado. SQLite es toda la base de datos.
  spec_footprint_h: Huella diminuta
