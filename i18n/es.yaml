mail:
  waitlist_confirm:
    subject: "Confirma tu lugar en la lista de espera de {app}"
    text: |
      Hola:

      Confirma que quieres unirte a la lista de espera de {app} abriendo este enlace:

      {link}

      Te enviaremos una invitación por correo cuando sea tu turno. Si no pediste unirte, ignora este mensaje: la dirección no se añade si no se abre el enlace.
    html: |
      <p>Hola:</p>
      <p>Confirma que quieres unirte a la lista de espera de {app}:</p>
      <p><a href="{link}">Confirmar mi lugar</a></p>
      <p>O pega este enlace en tu navegador: {link}</p>
      <p>Te enviaremos una invitación por correo cuando sea tu turno. Si no pediste unirte, ignora este mensaje: la dirección no se añade si no se abre el enlace.</p>
  waitlist_invite:
    subject: "Tu invitación a {app}"
    text: |
      Hola:

      Ya es tu turno: te invitamos a crear tu cuenta de {app}. Abre este enlace y regístrate con esta dirección de correo ({email}):

      {link}

      La invitación vale durante {days} días.
    html: |
      <p>Hola:</p>
      <p>Ya es tu turno: te invitamos a crear tu cuenta de {app}. Regístrate con esta dirección de correo ({email}).</p>
      <p><a href="{link}">Crear mi cuenta</a></p>
      <p>O pega este enlace en tu navegador: {link}</p>
      <p>La invitación vale durante {days} días.</p>
  terms_change:
    subject: "Los términos de {app} cambian el {date}"
    text: |
      Hola:

      Vamos a cambiar los términos de {app}. Los nuevos términos entran en vigor el {date}.

      Qué cambia:
      {summary}

      Lee los nuevos términos: {link}

      A partir del {date} te pediremos que los aceptes al iniciar sesión. Si no estás de acuerdo, puedes cerrar tu cuenta desde tu perfil.
    html: |
      <p>Hola:</p>
      <p>Vamos a cambiar los términos de {app}. Los nuevos términos entran en vigor el {date}.</p>
      <p>Qué cambia:</p>
      {summary}
      <p><a href="{link}">Leer los nuevos términos</a></p>
      <p>A partir del {date} te pediremos que los aceptes al iniciar sesión. Si no estás de acuerdo, puedes cerrar tu cuenta desde tu perfil.</p>
  verify_email:
    subject: "Confirma tu correo electrónico para {app}"
    text: |
      Hola,

      Confirma que esta es tu dirección de correo electrónico para {app} abriendo este enlace:

      {link}

      El enlace funciona una sola vez, durante 24 horas. Si no te registraste en {app}, ignora este mensaje: la dirección no queda confirmada a menos que se abra el enlace. {app} envía como máximo {max} de estos mensajes a una misma dirección al día.
    html: |
      <p>Hola,</p>
      <p>Confirma que esta es tu dirección de correo electrónico para {app}:</p>
      <p><a href="{link}">Confirmar mi correo electrónico</a></p>
      <p>O pega este enlace en tu navegador: {link}</p>
      <p>El enlace funciona una sola vez, durante 24 horas. Si no te registraste en {app}, ignora este mensaje: la dirección no queda confirmada a menos que se abra el enlace. {app} envía como máximo {max} de estos mensajes a una misma dirección al día.</p>
  password_reset:
    subject: "Restablece tu contraseña de {app}"
    text: |
      Hola,

      Alguien (esperamos que tú) pidió restablecer la contraseña de tu cuenta de {app}. Elige una nueva abriendo este enlace:

      {link}

      El enlace funciona una sola vez, durante una hora, y cierra tu sesión en todas partes. Si no lo pediste, ignora este mensaje; tu contraseña sigue igual.
    html: |
      <p>Hola,</p>
      <p>Alguien (esperamos que tú) pidió restablecer la contraseña de tu cuenta de {app}.</p>
      <p><a href="{link}">Elegir una contraseña nueva</a></p>
      <p>O pega este enlace en tu navegador: {link}</p>
      <p>El enlace funciona una sola vez, durante una hora, y cierra tu sesión en todas partes. Si no lo pediste, ignora este mensaje; tu contraseña sigue igual.</p>
  register_taken:
    subject: "Ya tienes una cuenta de {app}"
    text: |
      Hola,

      Alguien intentó crear una cuenta nueva de {app} con este correo electrónico. Ya tiene una cuenta, así que no se creó nada.

      Si fuiste tú, inicia sesión aquí:

      {login}

      ¿Olvidaste tu contraseña? Elige una nueva aquí:

      {reset}

      Si no fuiste tú, ignora este mensaje; tu cuenta no ha cambiado.
    html: |
      <p>Hola,</p>
      <p>Alguien intentó crear una cuenta nueva de {app} con este correo electrónico. Ya tiene una cuenta, así que no se creó nada.</p>
      <p>Si fuiste tú: <a href="{login}">Iniciar sesión</a></p>
      <p>¿Olvidaste tu contraseña? <a href="{reset}">Elegir una contraseña nueva</a></p>
      <p>Si no fuiste tú, ignora este mensaje; tu cuenta no ha cambiado.</p>
  account_deletion:
    subject: "Tu cuenta de {app} se eliminará el {date}"
    text: |
      Hola:

      Pediste eliminar tu cuenta de {app}. Se eliminará para siempre el {date}, con tu progreso, tus cursos y tus claves guardadas.

      Para conservarla, inicia sesión en {app} antes de esa fecha y elige Cancelar la eliminación.

      Si no lo pediste tú, inicia sesión, cancela la eliminación y cambia tu contraseña.
  data_export:
    subject: "Tus datos de {app} están listos para descargar"
    text: |
      Hola,

      La copia de tus datos de {app} que pediste está lista. Inicia sesión en {app} y abre este enlace para descargarla:

      {link}

      El enlace funciona una sola vez, durante 24 horas, y solo con la sesión iniciada en esta cuenta. Si no la pediste, cambia tu contraseña: otra persona ha iniciado sesión en tu cuenta.
    html: |
      <p>Hola,</p>
      <p>La copia de tus datos de {app} que pediste está lista. Inicia sesión en {app} y abre este enlace para descargarla:</p>
      <p><a href="{link}">Descargar mis datos</a></p>
      <p>El enlace funciona una sola vez, durante 24 horas, y solo con la sesión iniciada en esta cuenta. Si no la pediste, cambia tu contraseña: otra persona ha iniciado sesión en tu cuenta.</p>
  two_factor_changed:
    subject: "La verificación en dos pasos de {app} ha cambiado"
    now_off: ahora está desactivada
    now_email: ahora te envía un código por correo electrónico
    now_totp: ahora pide un código de una aplicación de autenticación
    text: |
      Hola,

      La verificación en dos pasos de {app} {now}.

      Se cerró la sesión en todos los demás dispositivos. Si no hiciste este cambio, otra persona tenía la sesión iniciada en tu cuenta: inicia sesión, usa «Cerrar sesión en todos los demás sitios» en tu perfil y vuelve a configurar la verificación en dos pasos.
    html: |
      <p>Hola,</p>
      <p>La verificación en dos pasos de {app} <strong>{now}</strong>.</p>
      <p>Se cerró la sesión en todos los demás dispositivos. Si no hiciste este cambio, otra persona tenía la sesión iniciada en tu cuenta: inicia sesión, usa «Cerrar sesión en todos los demás sitios» en tu perfil y vuelve a configurar la verificación en dos pasos.</p>
  login_code:
    subject: "Tu código de inicio de sesión de {app}"
    text: |
      Hola,

      Tu código para terminar de iniciar sesión en {app}:

      {code}

      Funciona durante 10 minutos. Si no intentaste iniciar sesión, cambia tu contraseña: alguien más la conoce.
    html: |
      <p>Hola,</p>
      <p>Tu código para terminar de iniciar sesión en {app}:</p>
      <p style="font-size:1.6em;letter-spacing:.15em"><strong>{code}</strong></p>
      <p>Funciona durante 10 minutos. Si no intentaste iniciar sesión, cambia tu contraseña: alguien más la conoce.</p>
  two_factor_confirm:
    subject: "Tu código de {app} para cambiar la verificación en dos pasos"
    text: |
      Hola,

      Tu código para desactivar o cambiar la verificación en dos pasos en {app}:

      {code}

      Funciona durante 10 minutos. Si no lo pediste, alguien más tiene la sesión iniciada en tu cuenta: usa «Cerrar sesión en todos los demás sitios» en tu perfil.
    html: |
      <p>Hola,</p>
      <p>Tu código para desactivar o cambiar la verificación en dos pasos en {app}:</p>
      <p style="font-size:1.6em;letter-spacing:.15em"><strong>{code}</strong></p>
      <p>Funciona durante 10 minutos. Si no lo pediste, alguien más tiene la sesión iniciada en tu cuenta: usa «Cerrar sesión en todos los demás sitios» en tu perfil.</p>
  course_share:
    subject: "{owner} compartió un curso contigo en {app}: {title}"
    text: |
      Hola,

      {owner} compartió contigo el curso “{title}” en {app}. Abre este enlace para añadirlo a tus cursos:

      {link}

      Puedes aprender del curso con tu propio progreso; solo {owner} puede cambiarlo. Si aún no tienes una cuenta en {app}, el enlace te permite crear una. Si no esperabas este mensaje, ignóralo.
    html: |
      <p>Hola,</p>
      <p>{owner} compartió contigo el curso <strong>{title}</strong> en {app}.</p>
      <p><a href="{link}">Abrir el curso</a></p>
      <p>O pega este enlace en tu navegador: {link}</p>
      <p>Puedes aprender del curso con tu propio progreso; solo {owner} puede cambiarlo. Si aún no tienes una cuenta en {app}, el enlace te permite crear una. Si no esperabas este mensaje, ignóralo.</p>

