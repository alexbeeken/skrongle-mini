landing:
  title: "Apprends n'importe quoi à partir d'un dossier de fichiers JSON"
  hero_h1: "Apprends n'importe quoi à partir d'un dossier de fichiers JSON."
  hero_lead: "{app} est une application d'apprentissage dans l'esprit des grandes plateformes d'apprentissage. Écrivez un cours en JSON simple, ajoutez-le, et chaque leçon devient des pages de leçon, des quiz adaptatifs, des cartes, des sessions de cinq minutes sur téléphone, de la pratique d'écoute et des jeux. Pas de code, pas de chaîne de production de contenu, pas de second format."
  create_account: Créer un compte
  read_format: Lire le format des cours
  have_account_html: "Vous avez déjà un compte ? <a href=\"{url}\" data-testid=\"landing-login\">Connectez-vous</a>."
  two_files_h2: "Un cours tient en deux fichiers. Tout le reste est facultatif."
  two_files_lead_html: "Un <code>course.json</code> nomme les unités et les deux faces de chaque carte. Chaque leçon est un fichier. Ajoutez un champ et une fonctionnalité s'active ; omettez-le et cette fonctionnalité ne s'affiche tout simplement pas pour cette leçon. Rien ne casse, rien ne proteste."
  field_content_html: "Markdown. Chaque section <code>##</code> devient une carte de leçon, une étape du Guide et une bouchée du mode Sprint."
  field_vocabulary: "Cartes, écoute au toucher, Paires de mots et les exercices d'appariement sur téléphone."
  field_quiz: "Pratique adaptative avec un score de maîtrise par leçon qui monte, descend et oriente la suite."
  field_listening: "Écoutez une phrase, tapez-la, voyez-la corrigée mot à mot. Lue par le navigateur, donc aucun audio à héberger."
  field_conjugations: "Tableaux de paradigmes de toute forme : formes verbales, déclinaisons, échelles. Un exercice de conjugaison et un exercice d'échelle les accompagnent."
  field_conversations: "Un dialogue scénarisé avec sa traduction sur la page de la leçon, et un exercice de construction de phrases en mode Sprint."
  field_sprint_guide: "Exercices écrits à la main et ordres d'étapes quand ceux qui sont dérivés ne suffisent pas."
  reference_html: "La référence complète, avec chaque champ et chaque règle que le validateur contrôle, se trouve à <a href=\"{url}\">/docs/course-format</a>. Il existe aussi un JSON Schema."
  three_ways_h2: Trois façons d'obtenir un cours
  write_h3: "Écrivez-le vous-même"
  write_p_html: "Cliquez sur <em>Créer un cours</em>, fermez la boîte de dialogue IA et modifiez les fichiers dans le navigateur. Chaque enregistrement valide le cours entier et indique le fichier et le champ exacts en cause, si bien qu'une coquille ne part jamais."
  llm_h3: "Laisse un LLM l'écrire"
  llm_p: "La page du format est écrite pour être donnée à un modèle. Collez-la dans n'importe quel chat, demandez des leçons, puis collez les réponses dans la page du cours. Ou décrivez le cours dans l'application, apportez votre propre clé d'API (Anthropic, OpenAI ou un serveur Ollama local) et regardez-le écrire et valider une leçon à la fois. La clé ne sert qu'à ce travail et n'est jamais stockée."
  ready_h3: "Pars d'un cours tout prêt"
  ready_p: "Des cours livrés avec l'application, écrits dans le même format : lisez-les comme des exemples travaillés et copiez ce qui vous plaît."
  course_units:
    one: "{n} unité"
    other: "{n} unités"
  course_lessons:
    one: "{n} leçon"
    other: "{n} leçons"
  every_way_h2: Un seul cours, toutes les façons de l'étudier
  every_way_lead: "Chaque fonctionnalité lit les mêmes fichiers. Vous n'écrivez rien deux fois."
  feat_sprint_h: "Sprint"
  feat_sprint_p: "Sessions de cinq minutes pensées pour le téléphone : tuiles de mots, tri, repérage, construction, échelle, appariement, exercices d'écoute, un objectif du jour et une série."
  feat_study_h: "Étude"
  feat_study_p: "Lisez les leçons correctement, puis faites des quiz pondérés vers ce que vous ratez. Une carte de chaque unité montre votre maîtrise."
  feat_play_h: "Jeu"
  feat_play_p: "Paires de mots avec un classement partagé, un exercice de conjugaison, Nombres à l'oreille, Course aux dates, cartes et le Guide."
  feat_ai_h: "Tutorat IA"
  feat_ai_p: "Un tuteur en tête-à-tête par chat qui enseigne la leçon, vérifie que vous suivez et lance le quiz quand vous êtes prêt. Fonctionne avec votre propre clé."
  feat_hear_h: "Écoute au toucher"
  feat_hear_p: "Dans un cours de langue, chaque mot qui compte peut être touché et lu à voix haute par les voix du navigateur."
  feat_mastery_h: "Une maîtrise qui s'estompe"
  feat_mastery_p: "Les bonnes réponses bâtissent un score avec des rendements décroissants, les mauvaises en retirent un morceau, et un mois d'absence le ramène vers la pratique."
  small_h2: Assez petit pour un Raspberry Pi
  spec_binary_h: Un seul binaire
  spec_binary_p: "Les modèles, le CSS, les scripts et la documentation sont compilés dedans ; les cours intégrés sont des fichiers simples à côté. SQLite est toute la base de données."
  spec_footprint_h: Empreinte minimale
  spec_footprint_p: "Dimensionné pour un Pi Zero 2 W : quelques mégaoctets sur le disque, quelques dizaines de mégaoctets en mémoire, deux travailleurs asynchrones."
  spec_data_h: Vos données restent à vous
  spec_data_p: "Fonctionne sur votre propre machine ou sur votre réseau local. Proxy TLS facultatif, aucun script tiers, aucun pistage."
  spec_docs_h: La documentation est incluse
  spec_docs_p: "Le format, les fonctionnalités et l'architecture sont servis par l'application elle-même, sous forme de pages ou de Markdown brut pour un LLM."
  final_h2: "Inscrivez-vous, puis répondez à une question : que voulez-vous apprendre ?"
  browse_docs: Parcourir la documentation
  feat_guide_h: "Guide"
  feat_guide_p: "Chaque leçon comme une étape de petits pas : cartes, vérifications rapides, fiches et astuces, avec des étoiles à la fin."
  try_lead: "Vingt secondes de chaque mode. Choisissez-en un et essayez."
  try_noscript: "Activez JavaScript pour essayer chaque mode ici."
  uses_h2: "Qu'est-ce que je peux en faire ?"
  use_niche_h: "Apprendre un sujet de niche"
  use_niche_p: "Personne ne vend de cours là-dessus ? Écrivez-en un, ou laissez une IA l'écrire à partir de vos notes."
  use_work_h: "Compléter une formation professionnelle"
  use_work_p: "Transformez le manuel ou le programme de certification en leçons et en quiz."
  use_goals_h: "Avancer vers des objectifs à long terme"
  use_goals_p: "Cinq minutes par jour sur votre téléphone, avec un objectif quotidien et une série pour tenir."
  use_fresh_h: "Garder les notions importantes en tête"
  use_fresh_p: "La maîtrise s'estompe quand vous vous absentez, et la pratique ramène d'abord ce qui s'efface."
  use_mood_h: "Étudier selon votre humeur"
