landing:
  title: Aprenda qualquer coisa a partir de uma pasta de arquivos JSON
  hero_h1: Aprenda qualquer coisa a partir de uma pasta de arquivos JSON.
  hero_lead: "{app} é um aplicativo de aprendizado no espírito das conhecidas plataformas de ensino. Escreva um curso como JSON simples, adicione-o, e cada lição vira páginas de lição, quizzes adaptativos, cartões, sessões de cinco minutos no celular, prática de escuta e jogos. Sem código, sem pipeline de conteúdo, sem um segundo formato."
  create_account: Criar uma conta
  read_format: Leia o formato do curso
  have_account_html: "Já tem uma conta? <a href=\"{url}\" data-testid=\"landing-login\">Entrar</a>."
  two_files_h2: Um curso são dois arquivos. Todo o resto é opcional.
  two_files_lead_html: Um <code>course.json</code> nomeia as unidades e os dois lados de cada cartão. Cada lição é um arquivo. Adicione um campo e um recurso é ativado; deixe-o de fora e esse recurso simplesmente não aparece nessa lição. Nada quebra, nada incomoda.
  field_content_html: Markdown. Cada seção <code>##</code> vira um cartão de lição, um passo do Guia e um bocado do modo Sprint.
  field_vocabulary: Cartões, toque para ouvir, Pares de palavras e os exercícios de correspondência no celular.
  field_quiz: Prática adaptativa com um domínio por lição que cresce, decai e define o que vem em seguida.
  field_listening: Ouça uma frase, digite-a e veja cada palavra conferida. Falada pelo navegador, então não há áudio para hospedar.
  field_conjugations: "Tabelas de paradigmas de qualquer formato: formas verbais, declinações, escalas. Vêm com um exercício de paradigmas e um exercício de escada."
  field_conversations: Um diálogo roteirizado com sua tradução na página da lição, e um exercício de montar frases no modo Sprint.
  field_sprint_guide: Exercícios escritos à mão e ordens de passos quando os gerados automaticamente não bastam.
  reference_html: "A referência completa, com cada campo e cada regra que o validador confere, está em <a href=\"{url}\">/docs/course-format</a>. Há também um JSON Schema."
  three_ways_h2: Três formas de conseguir um curso
  write_h3: Escreva você mesmo
  write_p_html: Clique em <em>Criar um curso</em>, feche o diálogo de IA e edite os arquivos no navegador. Cada salvamento valida o curso inteiro e aponta o arquivo e o campo exatos que estão errados, então um erro de digitação nunca vai ao ar.
  llm_h3: Deixe um LLM escrever
  llm_p: A página do formato é escrita para ser entregue a um modelo. Cole-a em qualquer chat, peça lições e depois cole as respostas na página do curso. Ou descreva o curso no aplicativo, traga sua própria chave de API (Anthropic, OpenAI ou um servidor Ollama local) e acompanhe a escrita e a validação uma lição de cada vez. A chave é usada só para esse trabalho e nunca é armazenada.
  ready_h3: Comece com um pronto
  ready_p: Cursos que vêm com o aplicativo, escritos no mesmo formato, para você lê-los como exemplos e copiar o que quiser.
  course_units:
    one: "{n} unidade"
    other: "{n} unidades"
  course_lessons:
    one: "{n} lição"
    other: "{n} lições"
  every_way_h2: Um curso, todas as formas de estudá-lo
  every_way_lead: Cada recurso lê os mesmos arquivos. Você não escreve nada duas vezes.
  feat_sprint_h: Sprint
  feat_sprint_p: "Sessões de cinco minutos pensadas para o celular: blocos de palavras, ordenação, identificação, montagem, escada, pares, exercícios de escuta, uma meta diária e uma sequência."
  feat_study_h: Estudo
  feat_study_p: Leia as lições com calma, depois faça quizzes com peso maior no que você erra. Um mapa de cada unidade mostra seu domínio.
  feat_play_h: Jogo
  feat_play_p: Pares de palavras com um placar compartilhado, um exercício de paradigmas, Números de ouvido, Corrida de datas, cartões e o Guia.
  feat_ai_h: Tutoria com IA
  feat_ai_p: Um tutor individual pelo chat que ensina a lição, confere se você acompanha e define o quiz quando você está pronto. Funciona com a sua própria chave.
  feat_hear_h: Toque para ouvir
  feat_hear_p: Em um curso de idioma, toda palavra importante pode ser tocada e lida em voz alta pelas vozes do próprio navegador.
  feat_mastery_h: Domínio que decai
  feat_mastery_p: Respostas certas formam uma pontuação com retornos decrescentes, as erradas tiram um pedaço dela, e um mês longe a faz voltar em direção à prática.
  small_h2: Pequeno o bastante para um Raspberry Pi
  spec_binary_h: Um binário
  spec_binary_p: Modelos, CSS, scripts e documentação são compilados junto; os cursos prontos são arquivos simples ao lado dele. SQLite é o banco de dados inteiro.
  spec_footprint_h: Pegada mínima
  spec_footprint_p: "Dimensionado para um Pi Zero 2 W: alguns megabytes em disco, dezenas de megabytes na memória, dois workers assíncronos."
  spec_data_h: Seus dados continuam seus
  spec_data_p: Roda na sua própria máquina ou na rede local. Proxy TLS opcional, sem scripts de terceiros, sem rastreamento.
  spec_docs_h: Documentação incluída
  spec_docs_p: O formato, os recursos e a arquitetura são servidos pelo próprio aplicativo, como páginas ou como Markdown puro para um LLM.
  final_h2: "Cadastre-se e responda uma pergunta: o que você gostaria de aprender?"
  browse_docs: Explore a documentação
  terms: Termos de Serviço
  feat_guide_h: "Guia"
  feat_guide_p: "Cada lição como uma etapa de passos pequenos: cartões, verificações rápidas, flashcards e dicas, com estrelas no fim."
  try_lead: "Vinte segundos de cada modo. Escolha um e experimente."
  try_noscript: "Ative o JavaScript para experimentar cada modo aqui."
  uses_h2: "O que posso fazer com isto?"
  use_niche_h: "Aprender um tema de nicho"
  use_niche_p: "Ninguém vende um curso sobre isso? Escreva um, ou deixe uma IA escrevê-lo a partir das suas notas."
  use_work_h: "Complementar a formação do trabalho"
  use_work_p: "Transforme o manual ou o programa da certificação em lições e questionários."
  use_goals_h: "Avançar em metas de longo prazo"
  use_goals_p: "Cinco minutos por dia no celular, com uma meta diária e uma sequência para manter o ritmo."
  use_fresh_h: "Manter conceitos importantes frescos"
  use_fresh_p: "O domínio desvanece quando você se afasta, e a prática traz de volta primeiro o que está a desvanecer."
  use_mood_h: "Estudar conforme o seu humor"
  use_mood_p: "Sprint no ônibus, leitura na mesa, um jogo quando estiver cansado. O progresso é o mesmo."
  use_exam_h: "Preparar-se para uma prova"
  use_exam_p: "Os questionários insistem no que você erra, então a revisão vai para onde é preciso."
  use_trip_h: "Preparar-se para uma viagem"
  use_trip_p: "As frases de que vai precisar, com cada palavra lida em voz alta."
  use_notes_h: "Transformar notas de aula num curso"
  use_notes_p: "Cole notas ou trabalhos de casa e receba lições, questionários e flashcards."
  use_agent_h: "Aprender com o seu próprio agente de IA"
  use_agent_p: "Um agente que ensina você fora do app informa o seu progresso a ele."
