      <strong>⚠️ Cuidado: isto pode quebrar seu curso e custar dinheiro.</strong>
              Estas são as instruções enviadas em cada requisição. O app ainda valida cada arquivo, e uma lição que não passa na validação é devolvida ao modelo até duas vezes; depois o trabalho para. Instruções que contrariam o formato do curso desperdiçam créditos de API em novas tentativas e geram cursos que não carregam. Não cole instruções que você não entende: textos de outras pessoas podem levar o modelo a escrever coisas que você não pediu. As regras do tipo de curso, a referência do formato do curso e o esboço são sempre acrescentados depois dessas instruções.
