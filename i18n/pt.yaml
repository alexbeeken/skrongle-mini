mail:
  waitlist_confirm:
    subject: "Confirme seu lugar na lista de espera do {app}"
    text: |
      Olá,

      Confirme que você quer entrar na lista de espera do {app} abrindo este link:

      {link}

      Vamos enviar um convite por e-mail quando chegar a sua vez. Se você não pediu para entrar, ignore esta mensagem: o endereço só é adicionado se o link for aberto.
    html: |
      <p>Olá,</p>
      <p>Confirme que você quer entrar na lista de espera do {app}:</p>
      <p><a href="{link}">Confirmar meu lugar</a></p>
      <p>Ou cole este link no seu navegador: {link}</p>
      <p>Vamos enviar um convite por e-mail quando chegar a sua vez. Se você não pediu para entrar, ignore esta mensagem: o endereço só é adicionado se o link for aberto.</p>
  waitlist_invite:
    subject: "Seu convite para o {app}"
    text: |
      Olá,

      Chegou a sua vez: você está convidado a criar sua conta no {app}. Abra este link e cadastre-se com este endereço de e-mail ({email}):

      {link}

      O convite vale por {days} dias.
    html: |
      <p>Olá,</p>
      <p>Chegou a sua vez: você está convidado a criar sua conta no {app}. Cadastre-se com este endereço de e-mail ({email}).</p>
      <p><a href="{link}">Criar minha conta</a></p>
      <p>Ou cole este link no seu navegador: {link}</p>
      <p>O convite vale por {days} dias.</p>
  terms_change:
    subject: "Os termos do {app} mudam em {date}"
    text: |
      Olá,

      Vamos mudar os termos do {app}. Os novos termos entram em vigor em {date}.

      O que muda:
      {summary}

      Leia os novos termos: {link}

      A partir de {date}, vamos pedir-lhe que os aceite ao entrar. Se não concordar, pode encerrar a sua conta no seu perfil.
    html: |
      <p>Olá,</p>
      <p>Vamos mudar os termos do {app}. Os novos termos entram em vigor em {date}.</p>
      <p>O que muda:</p>
      {summary}
      <p><a href="{link}">Ler os novos termos</a></p>
      <p>A partir de {date}, vamos pedir-lhe que os aceite ao entrar. Se não concordar, pode encerrar a sua conta no seu perfil.</p>
  verify_email:
    subject: "Confirme seu endereço de e-mail para {app}"
    text: |
      Olá,

      Confirme que este é o seu endereço de e-mail para {app} abrindo este link:

      {link}

      O link funciona uma vez, por 24 horas. Se você não se cadastrou no {app}, ignore esta mensagem: o endereço não fica confirmado enquanto o link não for aberto. O {app} envia no máximo {max} destas mensagens para um mesmo endereço por dia.
    html: |
      <p>Olá,</p>
      <p>Confirme que este é o seu endereço de e-mail para {app}:</p>
      <p><a href="{link}">Confirmar meu endereço de e-mail</a></p>
      <p>Ou cole este link no seu navegador: {link}</p>
      <p>O link funciona uma vez, por 24 horas. Se você não se cadastrou no {app}, ignore esta mensagem: o endereço não fica confirmado enquanto o link não for aberto. O {app} envia no máximo {max} destas mensagens para um mesmo endereço por dia.</p>
  password_reset:
    subject: "Redefina sua senha do {app}"
    text: |
      Olá,

      Alguém (esperamos que você) pediu para redefinir a senha da sua conta do {app}. Escolha uma nova abrindo este link:

      {link}

      O link funciona uma vez, por uma hora, e encerra sua sessão em todos os lugares. Se você não pediu, ignore esta mensagem; sua senha continua como está.
    html: |
      <p>Olá,</p>
      <p>Alguém (esperamos que você) pediu para redefinir a senha da sua conta do {app}.</p>
      <p><a href="{link}">Escolher uma nova senha</a></p>
      <p>Ou cole este link no seu navegador: {link}</p>
      <p>O link funciona uma vez, por uma hora, e encerra sua sessão em todos os lugares. Se você não pediu, ignore esta mensagem; sua senha continua como está.</p>
  register_taken:
    subject: "Você já tem uma conta no {app}"
    text: |
      Olá,

      Alguém tentou criar uma nova conta no {app} com este endereço de e-mail. Ele já tem uma conta, então nada foi criado.

      Se foi você, entre aqui:

      {login}

      Esqueceu sua senha? Escolha uma nova aqui:

      {reset}

      Se não foi você, ignore esta mensagem; sua conta não mudou.
    html: |
      <p>Olá,</p>
      <p>Alguém tentou criar uma nova conta no {app} com este endereço de e-mail. Ele já tem uma conta, então nada foi criado.</p>
      <p>Se foi você: <a href="{login}">Entrar</a></p>
      <p>Esqueceu sua senha? <a href="{reset}">Escolher uma nova senha</a></p>
      <p>Se não foi você, ignore esta mensagem; sua conta não mudou.</p>
  account_deletion:
    subject: "Sua conta do {app} será excluída em {date}"
    text: |
      Olá,

      Você pediu para excluir sua conta do {app}. Ela será excluída de vez em {date}, com seu progresso, seus cursos e chaves salvas.

      Para mantê-la, entre no {app} antes dessa data e escolha Cancelar exclusão.

      Se não foi você que pediu, entre, cancele a exclusão e mude sua senha.
  two_factor_changed:
    subject: "Verificação em duas etapas no {app} foi alterada"
    now_off: "está desativada"
    now_email: "agora envia um código por e-mail"
    now_totp: "agora pede um código de um aplicativo autenticador"
    text: |
      Olá,

      Verificação em duas etapas no {app} {now}.

      Todos os outros dispositivos foram desconectados. Se você não fez esta alteração, outra pessoa estava conectada à sua conta: entre, use “Sair de todos os outros lugares” no seu perfil e configure a verificação em duas etapas de volta.
    html: |
      <p>Olá,</p>
      <p>Verificação em duas etapas no {app} <strong>{now}</strong>.</p>
      <p>Todos os outros dispositivos foram desconectados. Se você não fez esta alteração, outra pessoa estava conectada à sua conta: entre, use “Sair de todos os outros lugares” no seu perfil e configure a verificação em duas etapas de volta.</p>
  login_code:
    subject: "Seu código de entrada no {app}"
    text: |
      Olá,

      Seu código para concluir a entrada no {app}:

      {code}

      Ele funciona por 10 minutos. Se você não tentou entrar, troque sua senha: outra pessoa a conhece.
    html: |
      <p>Olá,</p>
      <p>Seu código para concluir a entrada no {app}:</p>
      <p style="font-size:1.6em;letter-spacing:.15em"><strong>{code}</strong></p>
      <p>Ele funciona por 10 minutos. Se você não tentou entrar, troque sua senha: outra pessoa a conhece.</p>
  two_factor_confirm:
    subject: "Seu código para alterar a verificação em duas etapas no {app}"
    text: |
      Olá,

      Seu código para desligar ou alterar a verificação em duas etapas no {app}:

      {code}

      Ele funciona por 10 minutos. Se você não pediu, outra pessoa está conectada à sua conta: use “Sair de todos os outros lugares” no seu perfil.
    html: |
      <p>Olá,</p>
      <p>Seu código para desligar ou alterar a verificação em duas etapas no {app}:</p>
      <p style="font-size:1.6em;letter-spacing:.15em"><strong>{code}</strong></p>
      <p>Ele funciona por 10 minutos. Se você não pediu, outra pessoa está conectada à sua conta: use “Sair de todos os outros lugares” no seu perfil.</p>
  course_share:
    subject: "{owner} compartilhou um curso com você no {app}: {title}"
    text: |
      Olá,
      {owner} compartilhou o curso “{title}” com você no {app}. Abra este link para adicioná-lo aos seus cursos:
      {link}
      Você pode estudar o curso com o seu próprio progresso; só {owner} pode alterá-lo. Se você ainda não tem uma conta no {app}, o link permite criar uma. Se você não esperava este convite, ignore esta mensagem.
    html: |
      <p>Olá,</p>
      <p>{owner} compartilhou o curso <strong>{title}</strong> com você no {app}.</p>
      <p><a href="{link}">Abrir o curso</a></p>
      <p>Ou cole este link no seu navegador: {link}</p>
      <p>Você pode estudar o curso com o seu próprio progresso; só {owner} pode alterá-lo. Se você ainda não tem uma conta no {app}, o link permite criar uma. Se você não esperava este convite, ignore esta mensagem.</p>

