landing:
  title: 从一个 JSON 文件夹学习任何内容
  hero_h1: 从一个 JSON 文件夹学习任何内容。
  hero_lead: "{app} 是一款学习应用，理念与流行的学习平台相似。把课程写成普通的 JSON 文件添加进来，每节课就会变成课节页面、自适应测验、单词卡、五分钟手机练习、听力练习和游戏。无需代码，无需内容流水线，也没有第二种格式。"
  create_account: 创建账户
  read_format: 阅读课程格式
  have_account_html: "已有账户？<a href=\"{url}\" data-testid=\"landing-login\">登录</a>。"
  two_files_h2: 一门课程只需两个文件，其余都是可选的。
  two_files_lead_html: "<code>course.json</code> 列出单元，以及每张单词卡的两面。每节课是一个文件。添加一个字段，对应功能就会开启；不写，该功能就不会出现在这节课里。什么都不会出错，也不会有任何提醒。"
  field_content_html: Markdown。每个 <code>##</code> 小节会变成一张课节卡片、一个指南步骤和一个冲刺模式小节。
  field_vocabulary: 单词卡、点击听读、单词配对，以及手机上的配对练习。
  field_quiz: 自适应练习，每节课有一个会增长、会衰减的掌握度分数，并决定接下来练什么。
  field_listening: 听一句话，输入它，逐词查看检查结果。由浏览器朗读，因此无需托管音频文件。
  field_conjugations: "任意形状的变位表：动词变位、名词变格、音阶等。附带变位练习和阶梯练习。"
  field_conversations: 带译文的剧本对话，显示在课节页面上；冲刺模式中还有造句练习。
  field_sprint_guide: 当自动生成的练习和步骤顺序不够用时，可以手写练习和步骤顺序。
  reference_html: "完整参考，包括每个字段和验证器检查的每条规则，位于 <a href=\"{url}\">/docs/course-format</a>。另外还提供 JSON Schema。"
  three_ways_h2: 获取课程的三种方式
  write_h3: 自己编写
  write_p_html: 点击 <em>创建课程</em>，关闭 AI 对话框，然后在浏览器中编辑文件。每次保存都会验证整门课程，并指出出错的确切文件和字段，因此错别字不会上线。
  llm_h3: 让 LLM 来编写
  llm_p: 格式页面是专门为交给模型阅读而写的。把它粘贴到任意聊天中，请求生成课节，然后把回复的内容粘贴到课程页面中。或者在应用中描述课程，使用你自己的 API 密钥（Anthropic、OpenAI 或本地 Ollama 服务器），看着它逐节编写并验证。密钥仅用于这项工作，绝不会被存储。
  ready_h3: 从现成课程开始
  ready_p: 应用自带的课程，使用相同格式编写，你可以把它们当作范例阅读，并复制喜欢的部分。
  course_units:
    one: "{n} 个单元"
    other: "{n} 个单元"
  course_lessons:
    one: "{n} 节课"
    other: "{n} 节课"
  every_way_h2: 一门课程，多种学习方式
  every_way_lead: 每个功能读取的都是同一组文件，你无需重复编写任何内容。
  feat_sprint_h: 冲刺模式
  feat_sprint_p: "专为手机设计的五分钟课程：词块、分类、辨认、组句、阶梯、配对、听力练习，以及每日目标和连续天数。"
  feat_study_h: 学习模式
  feat_study_p: 认真阅读课节，然后进行测验，测验更侧重你答错的内容。学习地图显示每个单元的掌握情况。
  feat_play_h: 游戏模式
  feat_play_p: 带共享排行榜的单词配对、变位练习、听数字、日期竞速、单词卡和指南。
  feat_ai_h: AI 辅导
  feat_ai_p: 通过聊天进行一对一辅导：讲解课节，确认你跟上了，并在你准备好时出测验。使用你自己的密钥运行。
  feat_hear_h: 点击听读
  feat_hear_p: 在语言课程中，每个重要的词都可以点击，并由浏览器自带的语音朗读出来。
  feat_mastery_h: 会衰减的掌握度
  feat_mastery_p: 正确答案会累积分数，但收益递减；错误答案会扣掉一部分；一个月不练，分数会慢慢回落。
  small_h2: 小到能在树莓派上运行
  spec_binary_h: 单个二进制文件
  spec_binary_p: 模板、CSS、脚本和文档都已编译进去；内置课程是放在旁边的普通文件。SQLite 就是整个数据库。
  spec_footprint_h: 占用极小
  spec_footprint_p: "为 Pi Zero 2 W 设计：磁盘占用几兆字节，内存占用几十兆字节，两个异步工作线程。"
  spec_data_h: 你的数据归你所有
  spec_data_p: 运行在你自己的机器或局域网上。可选的 TLS 代理，没有第三方脚本，没有追踪。
  spec_docs_h: 内置文档
  spec_docs_p: 格式、功能和架构都直接由应用提供，既可以是网页，也可以是供 LLM 使用的原始 Markdown。
  final_h2: "注册，然后回答一个问题：你想学什么？"
  browse_docs: 浏览文档
  feat_guide_h: "引导"
  feat_guide_p: "把每节课变成由小步骤组成的一关：卡片、快速检查、抽认卡和提示，最后给星星。"
