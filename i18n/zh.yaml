mail:
  waitlist_confirm:
    subject: "确认你在 {app} 候补名单上的位置"
    text: |
      你好，

      请打开这个链接，确认你想加入 {app} 的候补名单：

      {link}

      轮到你时，我们会用电子邮件发送邀请。如果你没有申请加入，请忽略这封邮件：不打开链接，这个地址就不会被加入。
    html: |
      <p>你好，</p>
      <p>请确认你想加入 {app} 的候补名单：</p>
      <p><a href="{link}">确认我的位置</a></p>
      <p>或者把这个链接粘贴到浏览器：{link}</p>
      <p>轮到你时，我们会用电子邮件发送邀请。如果你没有申请加入，请忽略这封邮件：不打开链接，这个地址就不会被加入。</p>
  waitlist_invite:
    subject: "你的 {app} 邀请"
    text: |
      你好，

      轮到你了：我们邀请你创建 {app} 账户。打开这个链接，用这个电子邮件地址（{email}）注册：

      {link}

      邀请有效期为 {days} 天。
    html: |
      <p>你好，</p>
      <p>轮到你了：我们邀请你创建 {app} 账户。请用这个电子邮件地址（{email}）注册。</p>
      <p><a href="{link}">创建我的账户</a></p>
      <p>或者把这个链接粘贴到浏览器：{link}</p>
      <p>邀请有效期为 {days} 天。</p>
  account_deletion:
    subject: "你的 {app} 账户将于 {date} 被删除"
    text: |
      你好，

      你请求删除你的 {app} 账户。它将于 {date} 被永久删除，连同你的学习进度、课程和已保存的密钥。

      如要保留，请在此之前登录 {app} 并选择“取消删除”。

      如果这不是你本人的请求，请登录、取消删除并修改密码。
  two_factor_changed:
    subject: "{app} 上的两步验证已更改"
    now_off: 已关闭
    now_totp: 现在要求输入验证器应用中的验证码
    text: |
      你好，

      {app} 上的两步验证{now}。

      其他所有设备均已退出登录。如果这不是你的操作，说明有其他人已登录你的账户：请登录，使用个人设置中的“退出其他所有设备”，并重新设置两步验证。
    html: |
      <p>你好，</p>
      <p>{app} 上的两步验证<strong>{now}</strong>。</p>
      <p>其他所有设备均已退出登录。如果这不是你的操作，说明有其他人已登录你的账户：请登录，使用个人设置中的“退出其他所有设备”，并重新设置两步验证。</p>
  course_share:
    subject: "{owner} 在 {app} 上与你分享了一门课程：{title}"
    text: |
      你好，
      {owner} 在 {app} 上与你分享了课程“{title}”。打开此链接即可将它添加到你的课程中：
      {link}
      你可以用自己的学习进度学习这门课程；只有 {owner} 可以修改它。如果你还没有 {app} 账户，可以通过此链接注册。如果你并未期待这封邮件，请忽略。
    html: |
      <p>你好，</p>
      <p>{owner} 在 {app} 上与你分享了课程 <strong>{title}</strong>。</p>
      <p><a href="{link}">打开课程</a></p>
      <p>或将此链接粘贴到浏览器中：{link}</p>
      <p>你可以用自己的学习进度学习这门课程；只有 {owner} 可以修改它。如果你还没有 {app} 账户，可以通过此链接注册。如果你并未期待这封邮件，请忽略。</p>

