# The release QA rig (#41): every architecture's release tarball, each in a
# stock Debian container of that architecture, run from one laptop. This is a
# test rig, not a way to run Skrongle: self-hosters install the tarball under
# systemd (docs/self-hosting.md). README.md beside this file has the walkthrough.
#
#   cd scripts/release-qa
#   docker compose --profile setup run --rm binfmt        # once: QEMU handlers for the 32-bit ARM images
#   SKRONGLE_VERSION=0.1.2 docker compose --profile fetch run --rm fetch   # the release's tarballs into ../../dist
#   SKRONGLE_VERSION=0.1.2 docker compose up              # aarch64 on :8081, x86_64 on :8082
#   docker compose logs skrongle-aarch64 | grep "Owner link"   # the first account's link; open it as printed
#   ./matrix.sh 0.1.2                                      # package-smoke.sh per architecture, one table
#
# Variables (defaults in ${...:-}): SKRONGLE_VERSION, TARBALLS (where the
# tarballs are; ../../dist is where scripts/package-release.sh and the fetch
# profile put them), PORT_<ARCH>.
#
# Profiles: (none) the servers for aarch64 and x86_64; `arm32` adds armv7l and
# armv6l once a release ships them (#21); `fetch`, `setup`, and the `qa-*`
# services matrix.sh runs by name; `e2e` adds e2e-server-<arch> and e2e-<arch>
# (the release browser specs against the unpacked tarball; aarch64 and
# x86_64, run by matrix.sh with E2E=1); `simulator` adds simulator-<arch>, the
# AI simulator that e2e/specs/release/ai.spec.ts needs (with E2E_SIM=1; run by
# matrix.sh with E2E=1 SIM=1).
#
# Under QEMU (x86_64 on an ARM Mac through Rosetta is quick; armv7l and
# armv6l are slow) a page can take seconds and the first start minutes, so
# the health checks are patient and nothing here measures time.
#
# The qa-* services run two commands: `smoke` (package-smoke.sh, the default)
# and `upgrade` (upgrade-check.sh on the database each older release wrote,
# from ./fixtures, #43).

name: skrongle-release-qa

x-bullseye-sources: &bullseye-sources |
  deb http://archive.debian.org/debian bullseye main
  deb http://archive.debian.org/debian-security bullseye-security main
x-raspbian-sources: &raspbian-sources |
  deb http://archive.raspbian.org/raspbian bullseye main

x-server: &server
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
    interval: 15s
    timeout: 10s
    retries: 40
    start_period: 300s

# Each build names its platform three times, so that a Docker without
# BuildKit (the classic builder, which ignores `platforms:`) still builds the
# right image: `platforms:` for BuildKit, the PLATFORM argument that the
# Dockerfile puts on its FROM line, and architecture-named base images
# (arm64v8/debian, amd64/debian, ...) rather than the multi-arch "debian", so
# a cached host-architecture layer is never reused for another architecture.
# The armv6l services carry no run-time `platform:`: the classic builder
# drops the ARM variant from the image it builds (arm/v6 becomes plain arm,
# which Docker reads as v7), so Docker would refuse to start it for
# linux/arm/v6. The entrypoint checks the container's `uname -m` against ARCH
# instead, for every architecture.
x-build-aarch64: &build-aarch64
  context: .
  platforms: ["linux/arm64"]
  args: { PLATFORM: "linux/arm64", BASE: "arm64v8/debian:bullseye-slim", ARCHIVE_SOURCES: *bullseye-sources }
x-build-x86_64: &build-x86_64
  context: .
  platforms: ["linux/amd64"]
  args: { PLATFORM: "linux/amd64", BASE: "amd64/debian:bullseye-slim", ARCHIVE_SOURCES: *bullseye-sources }
x-build-armv7l: &build-armv7l
  context: .
  platforms: ["linux/arm/v7"]
  args: { PLATFORM: "linux/arm/v7", BASE: "arm32v7/debian:bullseye-slim", ARCHIVE_SOURCES: *bullseye-sources }
x-build-armv6l: &build-armv6l
  context: .
  platforms: ["linux/arm/v6"]
  args: { PLATFORM: "linux/arm/v6", BASE: "balenalib/rpi-raspbian:bullseye", ARCHIVE_SOURCES: *raspbian-sources }

x-e2e-server: &e2e-server
  profiles: [e2e]
  restart: "no"
  # A fresh database at every start (a run spends the owner link).
  tmpfs: [/var/lib/skrongle]
  command: serve-e2e
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
    interval: 3s
    timeout: 10s
    retries: 200
    start_period: 300s

# The AI simulator (profile simulator, #41): a dev-feature build of this
# checkout, started as scripts/release-e2e.sh starts its simulator (dev mode,
# a database of its own, the fixtures in data/test-fixtures/llm), so
# e2e/specs/release/ai.spec.ts runs against the tarball too. It is not in the
# tarball: the Linux binary of the rig's architecture is built on the host
# (matrix.sh with SIM=1 does it with cargo zigbuild) and mounted, with the
# repo's data/, into the same Debian 11 image as the server (entrypoint.sh
# `simulator`, which checks the architecture as for the server).
#
# Dev mode answers only requests made to localhost (a loopback bind, a
# loopback Host header, src/dev.rs), so the simulator cannot be reached by its
# compose name. It joins e2e-server-<arch>'s network namespace instead
# (network_mode: service:...), and so does the Playwright container: all three
# share one loopback, where the release server reaches the simulator at
# 127.0.0.1:8090 and the spec reads its call log there.
#
# E2E_SIM=1 is what turns the provider base URL on in e2e-server-<arch> and
# tells the spec where the simulator is (a profile cannot change another
# service's environment); without it both are empty, which the app and the
# spec read as unset, and the e2e profile runs as it did before.
x-simulator: &simulator
  profiles: [simulator]
  restart: "no"
  tmpfs: [/sim-state]
  working_dir: /sim
  command: simulator
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/dev/ai?format=json"]
    interval: 3s
    timeout: 10s
    retries: 200
    start_period: 300s

x-simulator-env: &simulator-env
  SKRONGLE_BIND: 127.0.0.1:8090
  SKRONGLE_DB: /sim-state/sim.db
  SKRONGLE_DATA_DIR: ./data
  SKRONGLE_LLM_DIR: /sim-state/llm
  SKRONGLE_LOG: info
  SKRONGLE_DEV: "1"
  SKRONGLE_DEV_FORCE: "1"
  # The image's invite-only signup is the release server's setting, not the simulator's (empty reads as unset).
  SKRONGLE_SIGNUP: ""

# Playwright's image for the version e2e/package.json pins (keep them equal):
# Chromium and its libraries for the host's architecture, so only the server
# is the architecture under test. Node and the specs run natively.
x-e2e-runner: &e2e-runner
  profiles: [e2e]
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  init: true
  entrypoint: ["bash", "/e2e-run.sh"]

services:
  # ---------- the servers: one per architecture, each on its own port ----------
  skrongle-aarch64:
    <<: *server
    image: skrongle-release-qa:aarch64
    platform: linux/arm64
    build: *build-aarch64
    environment:
      ARCH: aarch64
      SKRONGLE_VERSION: ${SKRONGLE_VERSION:-0.1.2}
      SKRONGLE_PUBLIC_URL: http://localhost:${PORT_AARCH64:-8081}
    ports: ["${PORT_AARCH64:-8081}:8080"]
    volumes:
      - ${TARBALLS:-../../dist}:/tarballs:ro
      - state-aarch64:/var/lib/skrongle

  skrongle-x86_64:
    <<: *server
    image: skrongle-release-qa:x86_64
    platform: linux/amd64
    build: *build-x86_64
    environment:
      ARCH: x86_64
      SKRONGLE_VERSION: ${SKRONGLE_VERSION:-0.1.2}
      SKRONGLE_PUBLIC_URL: http://localhost:${PORT_X86_64:-8082}
    ports: ["${PORT_X86_64:-8082}:8080"]
    volumes:
      - ${TARBALLS:-../../dist}:/tarballs:ro
      - state-x86_64:/var/lib/skrongle

  skrongle-armv7l:
    <<: *server
    profiles: [arm32]
    image: skrongle-release-qa:armv7l
    platform: linux/arm/v7
    build: *build-armv7l
    environment:
      ARCH: armv7l
      SKRONGLE_VERSION: ${SKRONGLE_VERSION:-0.1.2}
      SKRONGLE_PUBLIC_URL: http://localhost:${PORT_ARMV7L:-8083}
    ports: ["${PORT_ARMV7L:-8083}:8080"]
    volumes:
      - ${TARBALLS:-../../dist}:/tarballs:ro
      - state-armv7l:/var/lib/skrongle

  skrongle-armv6l:
    <<: *server
    profiles: [arm32]
    image: skrongle-release-qa:armv6l
    build: *build-armv6l
    environment:
      ARCH: armv6l
      SKRONGLE_VERSION: ${SKRONGLE_VERSION:-0.1.2}
      SKRONGLE_PUBLIC_URL: http://localhost:${PORT_ARMV6L:-8084}
    ports: ["${PORT_ARMV6L:-8084}:8080"]
    volumes:
      - ${TARBALLS:-../../dist}:/tarballs:ro
      - state-armv6l:/var/lib/skrongle

  # ---------- the checks: package-smoke.sh on that architecture's tarball (matrix.sh runs these by name) ----------
  qa-aarch64:
    profiles: [qa]
    image: skrongle-release-qa:aarch64
    platform: linux/arm64
    build: *build-aarch64
    command: smoke
    environment: { ARCH: aarch64, SKRONGLE_VERSION: "${SKRONGLE_VERSION:-0.1.2}", HEALTH_WAIT: "300" }
    volumes: ["${TARBALLS:-../../dist}:/tarballs:ro", "./fixtures:/usr/local/lib/release-qa/fixtures:ro"]

  qa-x86_64:
    profiles: [qa]
    image: skrongle-release-qa:x86_64
    platform: linux/amd64
    build: *build-x86_64
    command: smoke
    environment: { ARCH: x86_64, SKRONGLE_VERSION: "${SKRONGLE_VERSION:-0.1.2}", HEALTH_WAIT: "300" }
    volumes: ["${TARBALLS:-../../dist}:/tarballs:ro", "./fixtures:/usr/local/lib/release-qa/fixtures:ro"]

  qa-armv7l:
    profiles: [arm32]
    image: skrongle-release-qa:armv7l
    platform: linux/arm/v7
    build: *build-armv7l
    command: smoke
    environment: { ARCH: armv7l, SKRONGLE_VERSION: "${SKRONGLE_VERSION:-0.1.2}", HEALTH_WAIT: "600" }
    volumes: ["${TARBALLS:-../../dist}:/tarballs:ro", "./fixtures:/usr/local/lib/release-qa/fixtures:ro"]

  qa-armv6l:
    profiles: [arm32]
    image: skrongle-release-qa:armv6l
    build: *build-armv6l
    command: smoke
    environment: { ARCH: armv6l, SKRONGLE_VERSION: "${SKRONGLE_VERSION:-0.1.2}", HEALTH_WAIT: "600" }
    volumes: ["${TARBALLS:-../../dist}:/tarballs:ro", "./fixtures:/usr/local/lib/release-qa/fixtures:ro"]

  # ---------- the browser specs (profile e2e; matrix.sh with E2E=1 runs these) ----------
  # A server from the unpacked tarball on a fresh database (e2e-server-<arch>
  # writes its log to a volume), then the Playwright `release` projects
  # (e2e/specs/release; docs/testing.md, "Release specs") from a second
  # container, with the owner link read from that log. `docker compose
  # --profile e2e run --rm --build e2e-<arch>` starts the server it needs.
  e2e-server-aarch64:
    <<: *e2e-server
    image: skrongle-release-qa:aarch64
    platform: linux/arm64
    build: *build-aarch64
    environment: { ARCH: aarch64, SKRONGLE_VERSION: "${SKRONGLE_VERSION:-0.1.2}", SKRONGLE_PUBLIC_URL: "http://e2e-server-aarch64:8080", E2E_LOG: /e2e-log/server.log, SKRONGLE_ANTHROPIC_BASE_URL: "${E2E_SIM:+http://127.0.0.1:8090/dev/ai/anthropic}" }
    volumes: ["${TARBALLS:-../../dist}:/tarballs:ro", "e2e-log-aarch64:/e2e-log"]

  e2e-server-x86_64:
    <<: *e2e-server
    image: skrongle-release-qa:x86_64
    platform: linux/amd64
    build: *build-x86_64
    environment: { ARCH: x86_64, SKRONGLE_VERSION: "${SKRONGLE_VERSION:-0.1.2}", SKRONGLE_PUBLIC_URL: "http://e2e-server-x86_64:8080", E2E_LOG: /e2e-log/server.log, SKRONGLE_ANTHROPIC_BASE_URL: "${E2E_SIM:+http://127.0.0.1:8090/dev/ai/anthropic}" }
    volumes: ["${TARBALLS:-../../dist}:/tarballs:ro", "e2e-log-x86_64:/e2e-log"]

  e2e-aarch64:
    <<: *e2e-runner
    network_mode: "service:e2e-server-aarch64"
    depends_on:
      e2e-server-aarch64: { condition: service_healthy }
      simulator-aarch64: { condition: service_healthy, required: false }
    environment:
      E2E_BASE_URL: "http://e2e-server-aarch64:8080"
      E2E_SERVER_LOG: /e2e-log/server.log
      E2E_AI_SIM_URL: "${E2E_SIM:+http://127.0.0.1:8090}"
    volumes:
      - ../..:/repo:ro
      - ./e2e-run.sh:/e2e-run.sh:ro
      - ${E2E_RESULTS:-../../results/release-qa/e2e}:/out
      - e2e-log-aarch64:/e2e-log:ro

  e2e-x86_64:
    <<: *e2e-runner
    network_mode: "service:e2e-server-x86_64"
    depends_on:
      e2e-server-x86_64: { condition: service_healthy }
      simulator-x86_64: { condition: service_healthy, required: false }
    environment:
      E2E_BASE_URL: "http://e2e-server-x86_64:8080"
      E2E_SERVER_LOG: /e2e-log/server.log
      E2E_AI_SIM_URL: "${E2E_SIM:+http://127.0.0.1:8090}"
    volumes:
      - ../..:/repo:ro
      - ./e2e-run.sh:/e2e-run.sh:ro
      - ${E2E_RESULTS:-../../results/release-qa/e2e}:/out
      - e2e-log-x86_64:/e2e-log:ro

  simulator-aarch64:
    <<: *simulator
    image: skrongle-release-qa:aarch64
    platform: linux/arm64
    build: *build-aarch64
    network_mode: "service:e2e-server-aarch64"
    depends_on: { e2e-server-aarch64: { condition: service_started } }
    environment: { <<: *simulator-env, ARCH: aarch64, SKRONGLE_VERSION: "${SKRONGLE_VERSION:-0.1.2}" }
    volumes:
      - ${SIM_BIN_AARCH64:-../../target/aarch64-unknown-linux-gnu/debug/spanish-learning}:/usr/local/bin/skrongle-sim:ro
      - ../../data:/sim/data:ro

  simulator-x86_64:
    <<: *simulator
    image: skrongle-release-qa:x86_64
    platform: linux/amd64
    build: *build-x86_64
    network_mode: "service:e2e-server-x86_64"
    depends_on: { e2e-server-x86_64: { condition: service_started } }
    environment: { <<: *simulator-env, ARCH: x86_64, SKRONGLE_VERSION: "${SKRONGLE_VERSION:-0.1.2}" }
    volumes:
      - ${SIM_BIN_X86_64:-../../target/x86_64-unknown-linux-gnu/debug/spanish-learning}:/usr/local/bin/skrongle-sim:ro
      - ../../data:/sim/data:ro

  # ---------- one-shots ----------
  # The release's tarballs and checksums into TARBALLS (fetch.sh).
  fetch:
    profiles: [fetch]
    image: curlimages/curl:8.11.1
    user: "0:0"
    environment:
      SKRONGLE_VERSION: ${SKRONGLE_VERSION:-0.1.2}
      SKRONGLE_REPO: ${SKRONGLE_REPO:-alexbeeken/skrongle-mini}
      ARCHES: ${ARCHES:-aarch64 x86_64 armv7l armv6l}
    volumes:
      - ${TARBALLS:-../../dist}:/tarballs
      - ./fetch.sh:/fetch.sh:ro
    entrypoint: ["sh", "/fetch.sh"]

  # QEMU's binfmt handlers, so this Docker can run the other architectures'
  # containers. Once per machine (or per Docker VM). The only privileged
  # service here.
  binfmt:
    profiles: [setup]
    image: tonistiigi/binfmt
    privileged: true
    network_mode: none
    command: ["--install", "all"]

volumes:
  state-aarch64:
  state-x86_64:
  state-armv7l:
  state-armv6l:
  e2e-log-aarch64:
  e2e-log-x86_64:
