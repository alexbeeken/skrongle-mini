{# The circle on a course someone shared with this learner (`c`, `o` = who): it opens what the share means. #}
<button type="button" class="share-dot" data-open-dialog="course-shared-{{ c.id }}" aria-haspopup="dialog" aria-label="{{ crate::t1("courses.share.dot_label", "owner", o) }}" data-tip="{{ crate::t1("courses.share.dot_label", "owner", o) }}" data-testid="courses-card-shared" data-owner="{{ o }}"></button>
<dialog class="modal" id="course-shared-{{ c.id }}" aria-labelledby="course-shared-{{ c.id }}-title" data-testid="courses-card-shared-dialog">
  <h2 id="course-shared-{{ c.id }}-title">{{ crate::t("courses.share.shared_title") }}</h2>
  <p>{{ crate::t1("courses.share.shared_body", "owner", o) }}</p>
  <form method="dialog" class="modal-actions"><button type="submit" class="btn" data-testid="courses-card-shared-close">{{ crate::t("courses.share.ok") }}</button></form>
</dialog>
