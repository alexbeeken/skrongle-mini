<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev device</title>

<link rel="stylesheet" href="{{ crate::routes::asset_url("devbox.css") }}">
</head>
<body class="dev-device-body" data-base="{{ crate::base_path() }}">

<script src="{{ crate::routes::asset_url("devbox.js") }}" defer></script>

</html>
